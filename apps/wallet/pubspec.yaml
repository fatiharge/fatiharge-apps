name: wallet
description: Personal income/expense tracker — local-first, no backend.
publish_to: none
resolution: workspace

version: 0.2.1+5

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Monorepo packages.
  bootstrap_kit:
    path: ../../packages/bootstrap_kit
  utility_kit:
    path: ../../packages/utility_kit

  # State, DI, routing.
  auto_route: ^10.2.0
  # bloc is used directly by cubits/blocs; flutter_bloc only by the widgets.
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  injectable: ^2.5.2

  # Models, localization, formatting.
  easy_localization: ^3.0.8
  freezed_annotation: ^3.1.0
  intl: any
  meta: any

  # Local storage & charts.
  fl_chart: ^1.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.1
  font_awesome_flutter: ^11.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  lint_kit:
    path: ../../packages/lint_kit

  auto_route_generator: ^10.2.5
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  freezed: ^3.2.3
  injectable_generator: ^2.7.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
