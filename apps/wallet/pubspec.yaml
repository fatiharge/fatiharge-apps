name: wallet
description: Personal income/expense tracker — local-first, no backend.
publish_to: none
resolution: workspace

version: 0.2.8+12

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Monorepo packages.
  bootstrap_kit:
    path: ../../packages/bootstrap_kit
  utility_kit:
    path: ../../packages/utility_kit

  # State, DI, routing.
  auto_route: ^11.1.0
  # bloc is used directly by cubits/blocs; flutter_bloc only by the widgets.
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Models, localization, formatting.
  easy_localization: ^3.0.8
  freezed_annotation: ^3.1.0
  intl: any
  meta: any

  # Store review prompt: wraps SKStoreReviewController and Play's In-App
  # Review API, neither of which lets the app choose whether the dialog shows.
  in_app_review: ^2.0.12

  # Notifications. timezone is required by flutter_local_notifications for
  # scheduling — without an initialised database every scheduled time is UTC.
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1

  # Local storage & charts.
  fl_chart: ^1.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.1
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.2.1
  uuid: ^4.5.1
  app_settings: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  lint_kit:
    path: ../../packages/lint_kit

  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  freezed: ^3.2.3
  injectable_generator: ^3.1.3
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/translations/

# Regenerate the native launch screen with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#262C54"
  image: assets/branding/splash.png
  android_12:
    color: "#262C54"
    image: assets/branding/splash.png
    icon_background_color: "#262C54"

flutter_launcher_icons:
  image_path: assets/launcher/icon.png
  android: ic_launcher
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#262C54"
  adaptive_icon_foreground: assets/launcher/icon_foreground.png
