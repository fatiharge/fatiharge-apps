name: motto
description: Kişilik envanteri temelli motto ve alışkanlık zinciri.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  bootstrap_kit:
    path: ../../packages/bootstrap_kit
  utility_kit:
    path: ../../packages/utility_kit
  api_client_auth:
    path: ../../packages/api_client_auth
  api_client_motto:
    path: ../../packages/api_client_motto

  # Named directly because the app subclasses the generated client, and that
  # client's method signatures speak in http's Response.
  http: ^1.2.0

  auto_route: ^11.1.0
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  easy_localization: ^3.0.8

  flutter_secure_storage: ^11.0.0
  android_id: ^0.5.2
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # The chain's reminders are scheduled on the device: every one of them is a
  # function of a date the phone already knows, so push would add a server that
  # has to stay up and stay free for no gain. timezone is not optional — without
  # an initialised database every scheduled time is read as UTC.
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1

  # Attached to every piece of feedback, so nobody has to be asked "which
  # version?" — the answer people give is usually wrong anyway.
  package_info_plus: ^10.2.1

  # The home screen widget. It needs no permission, which is the whole point:
  # for someone who said no to notifications it is the only daily contact left.
  home_widget: ^0.9.0

  # The mascot. Rive rather than Lottie because the behaviour is interactive —
  # a state machine the file drives itself, rather than frames Dart has to push.
  rive: ^0.13.20
  meta: any
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint_kit:
    path: ../../packages/lint_kit
  mocktail: ^1.0.4
  auto_route_generator: ^10.5.0
  build_runner: ^2.5.4
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/mascot/
