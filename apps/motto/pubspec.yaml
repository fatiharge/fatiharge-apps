name: motto
description: Kişilik envanteri temelli motto ve alışkanlık zinciri.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  bootstrap_kit:
    path: ../../packages/bootstrap_kit
  utility_kit:
    path: ../../packages/utility_kit
  api_client_auth:
    path: ../../packages/api_client_auth
  api_client_motto:
    path: ../../packages/api_client_motto

  auto_route: ^11.1.0
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  easy_localization: ^3.0.8

  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  uuid: ^4.5.1
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint_kit:
    path: ../../packages/lint_kit
  auto_route_generator: ^10.5.0
  build_runner: ^2.5.4
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
