# Four fragments per archetype, and they are the whole reason a combinatorial
# day does not read like a fortune cookie.
#
# A fragment is not advice. It is the sentence that says "this is the shape of
# the trouble you specifically have with today's idea" — which only works if it
# names the same cost the archetype's summary named. A fragment that would fit
# any of the eighteen is a fragment that has not been written yet.
#
# Four each, rotated across the fourteen days, so nobody sees the same one twice
# in a week.

version: 1

fragments:
  # Sessiz İnşacı — düzenlilik ↑ · dışadönüklük ↓
  - archetype: quiet_builder
    index: 1
    tr: >-
      Sen zaten küçük başlıyorsun. Senin zorlandığın yer başlamak değil,
      başladığını birine söylemek.
  - archetype: quiet_builder
    index: 2
    tr: >-
      Sessizce biriktirdiğin için ilerlemeni sen de geç fark ediyorsun.
      Bugün fark ettiğin şeyi bir yere yaz, yoksa olmamış sayılıyor.
  - archetype: quiet_builder
    index: 3
    tr: >-
      Kimse bakmıyorken devam edebiliyorsun; bu nadir bir şey. Bedeli, kimse
      bakmadığı için durduğunda da kimsenin fark etmemesi.
  - archetype: quiet_builder
    index: 4
    tr: >-
      Duvarı bitirmeden göstermek istemiyorsun. Bugünlük ilk taşı göster.

  # Kıvılcım — açıklık ↑ · dışadönüklük ↑ · düzenlilik ↓
  - archetype: spark
    index: 1
    tr: >-
      Senin için tek bir şey seçmek, kötü olanları elemek değil; iyi olanlardan
      vazgeçmek. Zor olan da bu.
  - archetype: spark
    index: 2
    tr: >-
      Bugün yeni bir fikir gelirse yaz ve bırak. Yarın da orada olacak; olmazsa
      zaten tutmayacaktı.
  - archetype: spark
    index: 3
    tr: >-
      Sıkıldığın an bırakma anın değil, alışkanlığa dönüşme anın. Heyecan biterse
      geriye kalan şey işin kendisi.
  - archetype: spark
    index: 4
    tr: >-
      Bir şeye başlamak sende hiç sorun olmadı. Bugünün ölçüsü kaç şey
      başlattığın değil, kaçıncı gün aynı şeye döndüğün.

  # Gece Nöbetçisi — düzenlilik ↑ · duygusal tepkisellik ↑
  - archetype: night_watch
    index: 1
    tr: >-
      Ters gidebilecekleri zaten düşündün. Bugünlük sadece gidebilecek olanı
      yap, listenin tamamını değil.
  - archetype: night_watch
    index: 2
    tr: >-
      Bir günü kaçırınca aklından geçen senaryo, kaçırmanın kendisinden daha
      yorucu. Zincir bir günü affediyor, sen de affet.
  - archetype: night_watch
    index: 3
    tr: >-
      Tetikte olmak enerji harcıyor ve o enerji bir yerden geliyor. Bugün
      dinlenmeyi de yapılacak işlerden biri say.
  - archetype: night_watch
    index: 4
    tr: >-
      Hazırlıklı olmanı defalarca işe yaradığı için bırakmıyorsun. Doğru; ama
      her gün nöbet tutulmuyor.

  # Sofra Kuran — uyumluluk ↑ · dışadönüklük ↑
  - archetype: table_setter
    index: 1
    tr: >-
      Bugünkü bir dakika senin. Kimseye faydası olmayacak ve bu bir sorun değil.
  - archetype: table_setter
    index: 2
    tr: >-
      Birine söz verdiğinde tutuyorsun. Bu sefer sözü kendine verdiğin için
      daha kolay bırakıyorsun — fark ettin mi?
  - archetype: table_setter
    index: 3
    tr: >-
      Herkesin iyi hissetmesini ayarlarken sıra sana gelmiyor. Bugün sıraya
      önden gir.
  - archetype: table_setter
    index: 4
    tr: >-
      Anlatacak birini bulmak sende kolay. Zor olan, anlattığın şeyin sadece
      seninle ilgili olması.

  # İnce İşçi — açıklık ↑ · düzenlilik ↑
  - archetype: fine_worker
    index: 1
    tr: >-
      Bir dakikayı "yeterince iyi" yapmak sende zaman alıyor. Bugünlük ölçü
      kalite değil, olmuş olması.
  - archetype: fine_worker
    index: 2
    tr: >-
      Yarım bıraktığın şeylerin çoğu tembellikten değil, standardından yarım
      kaldı. Bugün standardı bir kademe indir.
  - archetype: fine_worker
    index: 3
    tr: >-
      Farkı kimsenin görmediği yerde de görüyorsun. Bugün görmediğin yerde bırak.
  - archetype: fine_worker
    index: 4
    tr: >-
      "Böyle olmaz" demek yerine bugün "şimdilik böyle" de. Yarın düzeltirsin.

  # Yön Veren — dışadönüklük ↑ · düzenlilik ↑ · uyumluluk ↓
  - archetype: compass
    index: 1
    tr: >-
      Karar vermek sende hızlı. Bugünkü karar küçük olduğu için değersiz
      görünüyor; asıl zor olan küçük kararı da vermek.
  - archetype: compass
    index: 2
    tr: >-
      Herkesi beklemeden yürüyorsun ve genelde doğru çıkıyor. Bugün kimseyi
      ikna etmen gerekmiyor, sadece kendini.
  - archetype: compass
    index: 3
    tr: >-
      Bir şey yavaş ilerliyorsa müdahale etme refleksin var. Bugün bırak
      ilerlesin.
  - archetype: compass
    index: 4
    tr: >-
      Yön göstermek yorucu bir iş ve kimse bunu senden istemiyor. Bugünkü yön
      sadece seninki.

  # Durgun Su — duygusal denge ↑ · dışadönüklük ↓
  - archetype: still_water
    index: 1
    tr: >-
      Telaşa kapılmadığın için acele de etmiyorsun. Bugün acele etmeden ama
      ertelemeden yap.
  - archetype: still_water
    index: 2
    tr: >-
      Sakin kalabilmen çevrendekilere iyi geliyor; bunun bir bedeli olduğunu
      genelde sadece sen biliyorsun.
  - archetype: still_water
    index: 3
    tr: >-
      Bir şeyi ertelediğinde huzursuz olmuyorsun, o yüzden erteleme sende
      sessiz ilerliyor. Bugün sessizliği bozan tek şey bu olsun.
  - archetype: still_water
    index: 4
    tr: >-
      Kimseyi rahatsız etmeden yaşamayı beceriyorsun. Bugün kendini biraz
      rahatsız et.

  # Derin Dalgıç — açıklık ↑ · dışadönüklük ↓
  - archetype: deep_diver
    index: 1
    tr: >-
      Bir konuya girdiğinde dibine kadar gidiyorsun. Bugünkü iş sığ ve bu
      bilerek böyle.
  - archetype: deep_diver
    index: 2
    tr: >-
      Anlamadığın bir şeyi yapmak sana ters. Bugün anlamadan yap, anlamı sonra
      gelecek.
  - archetype: deep_diver
    index: 3
    tr: >-
      Derine indiğin için yüzeyde olan biteni kaçırıyorsun. Bugün bir dakika
      yüzeyde kal.
  - archetype: deep_diver
    index: 4
    tr: >-
      Hazır olduğunda başlamayı seviyorsun. Hazır olmak diye bir gün yok;
      bugün de yok.

  # Kendi Saatinde — düzenlilik ↓ · dışadönüklük ↓
  - archetype: own_clock
    index: 1
    tr: >-
      Bugünün fikri sana kolay geliyor; zor olan yarın da aynı şeyi yapmak.
      Senin eksiğin istek değil, tekrar.
  - archetype: own_clock
    index: 2
    tr: >-
      Dalga geldiğinde çok şey yapıyorsun ve arada hiçbir şey. Bugün az yapmak,
      dalgayı beklemekten daha değerli.
  - archetype: own_clock
    index: 3
    tr: >-
      Kimseye söylemediğin için kimse hatırlatmıyor. Bugün hatırlatıcın sadece
      sensin, ve bu yeterli olmak zorunda.
  - archetype: own_clock
    index: 4
    tr: >-
      Sana kurulacak düzen tutmuyor. Bugünü düzen olarak değil, tek bir gün
      olarak al — o tutuyor.

  # Aykırı — düzenlilik ↓ · uyumluluk ↓
  - archetype: contrarian
    index: 1
    tr: >-
      Bugünün fikrine itirazın hazır. İtirazın haklı bile olsa, bugün itiraz
      etmek yapmanın yerine geçmiyor.
  - archetype: contrarian
    index: 2
    tr: >-
      Başkasının kurduğu şeyi sürdürmek sana ağır geliyor. Bunu kendi kurduğun
      bir şey say, o zaman ağırlığı düşüyor.
  - archetype: contrarian
    index: 3
    tr: >-
      Kimseye hesap vermiyorsun ve bu, hesap vereceğin tek kişinin sen olduğun
      anlamına geliyor. Bugün o kişi biraz sıkı olsun.
  - archetype: contrarian
    index: 4
    tr: >-
      Uymamak seni özgür yapıyor, sürdürmemek yapmıyor. Bugün ikisinin farkını
      bir kere yaşa.

  # Ayağı Yerde — açıklık ↓ · düzenlilik ↓
  - archetype: feet_on_ground
    index: 1
    tr: >-
      Bugünün fikri sana fazla soyut gelebilir. Somutla: nerede, ne zaman, ne
      kadar. Üçü belliyse gerisi kolay.
  - archetype: feet_on_ground
    index: 2
    tr: >-
      Sen anlatılanla değil, yapılanla öğreniyorsun. Bugün anlamaya çalışma,
      bir kere yap ve sonra bak.
  - archetype: feet_on_ground
    index: 3
    tr: >-
      Yeni olan seni çekmiyor ve bu bir sorun değil. Bugün merak etmeden yap;
      merak sonradan gelirse gelir.
  - archetype: feet_on_ground
    index: 4
    tr: >-
      Planı olmayan şeyi de yapabiliyorsun, bu senin avantajın. Bugünkü tek
      şart: bir kere olsun.

  # Olduğu Gibi — dışadönüklük ↓ · uyumluluk ↓
  - archetype: as_is
    index: 1
    tr: >-
      Bugünün fikrini kimseye anlatmayacaksın, biliyorum. O yüzden bugün tek
      tanık sensin — ve tanıklık da bir iş.
  - archetype: as_is
    index: 2
    tr: >-
      Kimseyi idare etmediğin için kendini de idare etmiyorsun. Bugün bu iyi
      bir şey: bahane üretmiyorsun.
  - archetype: as_is
    index: 3
    tr: >-
      Uzak durmak sana enerji kazandırıyor. Bugün o enerjinin bir kısmını
      buraya harca, tamamını değil.
  - archetype: as_is
    index: 4
    tr: >-
      Tıkandığında kimse fark etmiyor, çünkü kimseye söylemiyorsun. Bugün
      tıkanırsan, en azından kendine söyle.

  # Masayı Deviren — dışadönüklük ↑ · uyumluluk ↓ · duygusal tepkisellik ↑
  - archetype: table_upsetter
    index: 1
    tr: >-
      Senin için zor olan başlamak değil, başladığını duyurduktan sonra
      geri adım atmadan sürdürmek. Bugün kimseye duyurmadan yap.
  - archetype: table_upsetter
    index: 2
    tr: >-
      Bir şeyin yanlış olduğunu görmek sende hızlı, düzeltmek yavaş. Bugün
      itiraz ettiğin bir şeyin yerine ne koyacağını da yaz.
  - archetype: table_upsetter
    index: 3
    tr: >-
      Tepkin geçtikten sonra ortada kalan işi genelde başkası topluyor.
      Bugünkü küçük şeyi sonuna kadar sen taşı.
  - archetype: table_upsetter
    index: 4
    tr: >-
      Haklı olduğun bir konuda ısrar etmek sana bedava geliyor; ısrar
      etmediğinde ne olacağını denemek pahalı. Bugün bir kez deneme.

  # Hafif Ayaklı — dışadönüklük ↑ · duygusal tepkisellik ↓
  - archetype: light_footed
    index: 1
    tr: >-
      Bugünkü şeyi atlarsan canını sıkmayacak, mesele de bu. Seni tutan şey
      rahatsızlık olmayacak; o yüzden çıpanı sağlam bir yere bağla.
  - archetype: light_footed
    index: 2
    tr: >-
      Zorlanmadığın için ilerlediğini de fark etmiyorsun. Bugün yaptığını bir
      yere işaretle, yoksa yapmamışsın gibi duracak.
  - archetype: light_footed
    index: 3
    tr: >-
      Bir aksilik seni durdurmuyor ama bir boşluk durduruyor. Bugün araya bir
      gün girerse, ertesi gün aynı saatte orada ol.
  - archetype: light_footed
    index: 4
    tr: >-
      Herkesle iyi geçindiğin için kimseye söz vermiyorsun. Bugünkü şeyi bir
      kişiye söyle; ağırlığı oradan gelsin.

  # Dolu Bardak — düzenlilik ↓ · duygusal tepkisellik ↑
  - archetype: full_glass
    index: 1
    tr: >-
      Bugünkü şey sana küçük geldiyse doğru seçmişsin. Sende plan büyüdükçe
      yapılma ihtimali düşüyor, tersi değil.
  - archetype: full_glass
    index: 2
    tr: >-
      Kötü bir gün senin için "bugün olmaz" demek zorunda değil. Yarısını yap
      ve yarısını yapmış say — zincir bunu kabul ediyor.
  - archetype: full_glass
    index: 3
    tr: >-
      Aklında aynı anda duran şeylerin sayısı, bugünkü işi zorlaştıran asıl
      sebep. Yapmadan önce bir tanesini bir yere yaz ve kafandan çıkar.
  - archetype: full_glass
    index: 4
    tr: >-
      Bir günü kaçırdığında bunu bir karakter meselesi yapıyorsun. Kaçan gün
      bir gün; ertesi sabah aynı yerden devam.

  # Sözü Senet — uyumluluk ↑ · düzenlilik ↑
  - archetype: word_is_bond
    index: 1
    tr: >-
      Bugünkü şey sana ait ve sadece sana. Başkasının işine dönüşme ihtimali
      olan her şeyi bugünlük dışarıda bırak.
  - archetype: word_is_bond
    index: 2
    tr: >-
      Birine söz verseydin çoktan yapmıştın. Bugünkü şeye de aynı gözle bak:
      bu da bir söz, sadece muhatabı sensin.
  - archetype: word_is_bond
    index: 3
    tr: >-
      Sıra sana geldiğinde gün bitmiş oluyor. Bugün onu en sona değil, ilk
      boşluğa koy.
  - archetype: word_is_bond
    index: 4
    tr: >-
      Yükü sessizce almak sana doğal geliyor, o yüzden kimse azaltmıyor.
      Bugün bir kişiye ne taşıdığını söyle.

  # Yerli Yerinde — açıklık ↓ · düzenlilik ↑ · duygusal tepkisellik ↓
  - archetype: in_its_place
    index: 1
    tr: >-
      Bugünkü şeyi zaten yapıyorsan onu değiştirme, yerini değiştir. Sende
      sürdürmek kolay, tazelemek zor.
  - archetype: in_its_place
    index: 2
    tr: >-
      Yeni bir şeyi denemeden önce gerekçe istiyorsun ve bu genelde doğru.
      Bugünlük gerekçe şu: on dört gün sonra hâlâ aynı yerde olmak istemiyorsun.
  - archetype: in_its_place
    index: 3
    tr: >-
      Bir şeyin bozulduğunu geç fark ediyorsun, çünkü uzun süredir orada.
      Bugün, alışkanlıktan yaptığın bir şeyi bir kez sorgula.
  - archetype: in_its_place
    index: 4
    tr: >-
      Düzenin sağlam olduğu için bugünkü şeyi de düzenin içine gömeceksin.
      Bugünlük onu ayrı tut; ayrı durursa görünür.

  # İçten İçe — uyumluluk ↑ · dışadönüklük ↓ · duygusal tepkisellik ↑
  - archetype: inwardly
    index: 1
    tr: >-
      Bugünkü şeyi kimseye söylemeyeceksin, biliyorum. Bir kişiye söyle;
      söylediğin an senin için de gerçek oluyor.
  - archetype: inwardly
    index: 2
    tr: >-
      Başkasının gününü okumak sende otomatik, kendi gününü okumak değil.
      Bugün bir kez kendine sor: bugün nasıldım.
  - archetype: inwardly
    index: 3
    tr: >-
      Birinin ihtiyacı çıkarsa bugünkü şeyi hemen bırakırsın. Bugünlük
      bırakma; on dakika sonra da orada olacak.
  - archetype: inwardly
    index: 4
    tr: >-
      İçeride tuttuğun şey küçülmüyor, birikiyor. Bugünkü işi yaparken
      aklından geçeni bir yere yaz — okuyacak kimse olmasa bile.
