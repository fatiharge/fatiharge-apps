# What the app answers when somebody asks.
#
# Served rather than shipped, so a wrong answer is fixed without a store
# release — and there is exactly one wrong answer that matters here, the one
# about where somebody's data is.
#
# Every answer names the cost plainly rather than working around it. "Your
# streak is gone and there is no account to restore it from" is the answer that
# does not become a one-star review; a reassuring non-answer is.

version: 1

privacy:
  tr:
    - Adın, e-postan ya da telefon numaran istenmiyor. Hesap yok.
    - Tutulan kimlik seni değil, telefonu tanıyor.
    - Cevapların puanlanıp sonucu döndürülüyor; cevapların saklanmıyor.
    - Arketibin, zincirin ve işaretlediğin görevler o kimliğe bağlı duruyor.
    - Hatırlatıcı saatin ve yarım kalmış testin yalnızca telefonunda.
    - "Ölçüm kendi sunucumuzda: üçüncü parti araç yok, reklam kimliği yok."
    - Paylaştığın kartta yalnızca arketibinin adı ve mottosu var.

deletion:
  tr:
    goes:
      - Arketibin ve aldığın mottolar
      - Zincirin ve işaretlediğin günler
      - Yaptığın görevler
    stays:
      - Cihaz kimliğin
      - Kullandığın hak sayısı
    counter_reason: >-
      Kullanım hakkı sayacı, suistimali önlemek için saklanır: silip yeniden
      yükleyerek hak kazanılamaz. Bu sayaç kim olduğunu değil, kaç kez
      kullandığını bilir.
    answers_note: >-
      Test cevapların zaten saklanmıyor; puanlanıp unutuluyorlar.

faq:
  - id: data_on_device
    tr:
      question: Verilerim nerede tutuluyor?
      answer: >-
        Arketibin, zincirin ve görevlerin sunucuda, cihazına bağlı bir kimlikle
        — isminle değil. Test cevapların saklanmıyor: puanlanıp unutuluyorlar.
  - id: no_account
    tr:
      question: Neden hesap açmıyorum?
      answer: >-
        Çünkü gerekmiyor. Hesapsız başlamak, seni bir e-posta vermeye
        zorlamadan kullanmanın tek yolu. Bunun bedeli aşağıdaki maddede
        yazıyor.
  - id: lost_data
    tr:
      question: Telefonumu değiştirirsem ne olur?
      answer: >-
        Zincirin gider. Kayıtlar cihazına bağlı ve hesap olmadığı için yeni
        telefona taşıyacak bir yer yok — bu, hesapsız çalışmanın bedeli.
  - id: why_wait
    tr:
      question: Neden hemen yeni bir envanter dolduramıyorum?
      answer: >-
        Kişilik iki günde değişmez. Arka arkaya çözülen bir envanter, cevabı
        değil ruh halini ölçer. Bekleme süresi sonucun bir anlamı olsun diye.
  - id: accuracy
    tr:
      question: Sonuç ne kadar doğru?
      answer: >-
        Kısa bir form, kaba bir çözünürlük verir. Arketip bilimsel bir kategori
        değil, beş boyutlu bir profilin editöryal yorumu. Yöntem sayfasında
        sınırlılıkları tek tek yazdık.
  - id: not_me
    tr:
      question: Arketip bana uymadı, ne yapayım?
      answer: >-
        Sonuç ekranındaki "bana uymadı" bağlantısını kullan. Hangi arketibin ne
        sıklıkla reddedildiği, eşleme tablosunu düzeltmek için elimizdeki tek
        sinyal.
  - id: chain_broken
    tr:
      question: Zincirim kırıldı, geri gelir mi?
      answer: >-
        Ayda bir telafi hakkın var ve tek bir kaçan günü kapatır. İki gün
        kaçtıysa kapatmaz — kapatsaydı zincirin bir anlamı kalmazdı.
  - id: offline
    tr:
      question: İnternetsiz çalışır mı?
      answer: >-
        Günü işaretlemek çalışır, bağlantı gelince gönderilir. Günlük içerik ve
        görevler sunucudan geliyor, o yüzden onlar için bağlantı gerekiyor.
  - id: notifications_off
    tr:
      question: Bildirimlere izin vermedim, zincir çalışır mı?
      answer: >-
        Çalışır. Sadece hatırlatma gelmez; günü kendin işaretlersin. iOS izni
        bir kez sorar, sonrasında yalnızca sistem ayarlarından açılır.
  - id: reminder_time
    tr:
      question: Hatırlatma saatini değiştirebilir miyim?
      answer: >-
        Ayarlar ekranından. Günde en fazla bir hatırlatma gelir ve 22:00 ile
        08:00 arasında hiç gelmez.
  - id: too_many
    tr:
      question: Neden bazen hiç bildirim gelmiyor?
      answer: >-
        Üst üste üç bildirimi açmazsan sıklık kendiliğinden düşer. Görmezden
        gelinen bir hatırlatıcının çözümü dördüncüsü değil.
  - id: delete_data
    tr:
      question: Verilerimi sildirebilir miyim?
      answer: >-
        Ayarlar → Gizlilik → Verilerimi sil. Arketibin, zincirin ve görevlerin
        silinir. Cihaz kimliğin ve kullandığın hak sayısı kalır; silip yeniden
        yükleyerek hak kazanılmasın diye.
  - id: cost
    tr:
      question: Ücretli mi?
      answer: >-
        Envanter, sonuç, kart, zincir ve günlük görevler ücretsiz. Derin rapor
        ve arketip galerisi premium.
  - id: game
    tr:
      question: Oyun ne işe yarıyor?
      answer: >-
        Eğlence, ve haftanın en iyi 10 skoru bir derin rapor kazanıyor.
  - id: share_card
    tr:
      question: Paylaştığım kartta ne görünüyor?
      answer: >-
        Arketibinin adı ve mottosu. Cevapların, puanların ve cihaz kimliğin
        kartta yok.
  - id: contact
    tr:
      question: Size nasıl ulaşırım?
      answer: >-
        Ayarlar → Geri bildirim. E-posta bırakmak zorunda değilsin; bırakmazsan
        okuruz ama cevap yazamayız.
