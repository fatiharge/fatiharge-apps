# The eighteen archetypes the launch ships with.
#
# Text only. The thresholds that decide which one a profile vector lands on are
# data of their own, and they live with the scoring service — a copy edit must
# never be able to change who gets which result.
#
# `profile` is a note for whoever writes the next piece of copy, not something
# the code reads.

version: 1

archetypes:
  - id: quiet_builder
    profile: düzenlilik ↑ · dışadönüklük ↓
    tr:
      name: Sessiz İnşacı
      summary: >-
        Gürültü çıkarmadan biriktirirsin; kimse ilk taşı görmez, herkes duvarı
        görür. Bedeli şu: görünmediğin için çoğu zaman hakkın da teslim edilmez.
      motto: Acele etmeyen ama durmayan.

  - id: spark
    profile: açıklık ↑ · dışadönüklük ↑ · düzenlilik ↓
    tr:
      name: Kıvılcım
      summary: >-
        Bir sürü şeye başlarsın ve sorun ilgisizlik değil — hepsinin gerçekten
        iyi fikir olması. Zor olan tutuşturmak değil, birini seçmek.
      motto: Bugün sadece bir tanesi.

  - id: night_watch
    profile: düzenlilik ↑ · duygusal tepkisellik ↑
    tr:
      name: Gece Nöbetçisi
      summary: >-
        Sen fark ettiğinde iş henüz olmamıştır. Herkes rahatken senin çoktan
        düşünmüş olman yorucu, ama defalarca işe yaradı.
      motto: Tetikte olmak da bir güç, dinlenmek de.

  - id: table_setter
    profile: uyumluluk ↑ · dışadönüklük ↑
    tr:
      name: Sofra Kuran
      summary: >-
        İnsanları bir araya getiren sensin ve bunu kimse senden istemiyor bile.
        Herkesin iyi hissetmesini o kadar önemsiyorsun ki, sıra sana geldiğinde
        masada yer kalmıyor.
      motto: Onlardan önce bir de bana sor.

  - id: fine_worker
    profile: açıklık ↑ · düzenlilik ↑
    tr:
      name: İnce İşçi
      summary: >-
        "Olur böyle" cümlesi sende çalışmıyor; farkı kimsenin görmediği yerde de
        görüyorsun. Bitirmeni zorlaştıran şey tembellik değil, standardın.
      motto: Mükemmel değil, bitmiş olsun.

  - id: compass
    profile: dışadönüklük ↑ · düzenlilik ↑ · uyumluluk ↓
    tr:
      name: Yön Veren
      summary: >-
        Kimse karar vermeyince sen veriyorsun ve genelde doğru çıkıyor. Bedeli:
        herkesin katılmasını beklemediğin için bazen yalnız yürüyorsun.
      motto: Karar vermek de bir yük, taşıyorum.

  - id: still_water
    profile: duygusal tepkisellik ↓ · uyumluluk ↑ · dışadönüklük ↓
    tr:
      name: Durgun Su
      summary: >-
        Herkes telaşlanırken sen sakin kalıyorsun ve bu, etrafındakileri de
        sakinleştiriyor. Ama o kadar sorun etmiyorsun ki, gerçekten sorun olan
        şey de gecikiyor.
      motto: Sakinim, kayıtsız değil.

  - id: deep_diver
    profile: açıklık ↑ · duygusal tepkisellik ↑ · dışadönüklük ↓
    tr:
      name: Derin Dalgıç
      summary: >-
        Her şeyi bir kat daha derinden yaşıyorsun; iyisini de kötüsünü de.
        Yüzeyde kalabilseydin rahat ederdin ama o zaman sen olmazdın.
      motto: Derinde kalmak değil, dalıp çıkmak.

  - id: own_clock
    profile: düzenlilik ↓ · dışadönüklük ↓
    tr:
      name: Kendi Saatinde
      summary: >-
        Sistemle değil, dalgayla çalışıyorsun; geldiğinde tamamen geliyor.
        Bedeli şu: hiçbir şey birikmiyor, ve kimse sana göre plan yapamıyor —
        sen de dahil.
      motto: Kendi saatimde ama her gün.

  - id: contrarian
    profile: düzenlilik ↓ · uyumluluk ↓
    tr:
      name: Aykırı
      summary: >-
        Ne düzenmiş gibi yapıyorsun ne de katılıyormuş gibi, o yüzden senden
        duyduğun şey gerçek olan. Bedeli şu: sonradan ihtiyacın olacak iyi
        niyeti bugün harcıyorsun.
      motto: Karşı çıkmak kolay, sürdürmek zor.

  - id: feet_on_ground
    profile: açıklık ↓ · düzenlilik ↓
    tr:
      name: Ayağı Yerde
      summary: >-
        Bugünün işine bakıyorsun ve elindekiyle çözüyorsun; teoriye de plana da
        ihtiyacın olmuyor. Bedeli şu: hiçbir şey değişmiyor, çünkü değişim ya
        merak ister ya plan, ikisini de taşımıyorsun.
      motto: Bugün elimde olanla.

  - id: as_is
    profile: dışadönüklük ↓ · uyumluluk ↓
    tr:
      name: Olduğu Gibi
      summary: >-
        Ne yakınlık için uğraşıyorsun ne de araları düzeltmek için; seni
        tanıyan, tam olarak seni tanıyor. Bedeli şu: bir süre sonra kimse
        sormuyor, ve bunu ancak bir şeye ihtiyacın olduğunda fark ediyorsun.
      motto: Az kişiye açık, onlara tamamen.

  - id: table_upsetter
    profile: dışadönüklük ↑ · uyumluluk ↓ · duygusal tepkisellik ↑
    tr:
      name: Masayı Deviren
      summary: >-
        Odada kimsenin söylemediği şeyi sen söylüyorsun ve genelde söylenmesi
        gerekiyordu. Bedeli şu: söyledikten sonra orada kalman gerekiyor, ve
        kalmak söylemekten çok daha zor.
      motto: Söylemesi kolaydı, kalması değil.

  - id: light_footed
    profile: dışadönüklük ↑ · duygusal tepkisellik ↓
    tr:
      name: Hafif Ayaklı
      summary: >-
        Kalabalık da aksilik de seni yormuyor; ikisinin içinden aynı rahatlıkla
        geçiyorsun. Bedeli şu: hiçbir şeyi büyütmediğin için gerçekten büyük
        olanı da geç fark ediyorsun.
      motto: Taşımadan da gidilir, ama bunu değil.

  - id: full_glass
    profile: düzenlilik ↓ · duygusal tepkisellik ↑
    tr:
      name: Dolu Bardak
      summary: >-
        Her şeyi aynı anda ve tamamen hissediyorsun, o yüzden zor olan ne
        yapacağın değil neyi önce yapacağın. Bedeli şu: taşmamak için
        harcadığın enerjiyi işin kendisine ayıramıyorsun.
      motto: Bir yudum boşalt, sonra taşı.

  - id: word_is_bond
    profile: uyumluluk ↑ · düzenlilik ↑
    tr:
      name: Sözü Senet
      summary: >-
        Söylediğin şey oluyor ve insanlar bunu sen söylemeden önce biliyorlar.
        Bedeli şu: kimse senden "yapamam" duymadığı için sormaya da devam
        ediyor, ve sıra kendi işine en son geliyor.
      motto: Söz verdiğim kadarı, o kadarı da tam.

  - id: in_its_place
    profile: açıklık ↓ · düzenlilik ↑ · duygusal tepkisellik ↓
    tr:
      name: Yerli Yerinde
      summary: >-
        Denenmiş olanı denenmiş olduğu için seçiyorsun ve bu seni sarsılmaz
        yapıyor; etrafındakiler de bunu bilerek plan yapıyor. Bedeli şu:
        değişmesi gereken şey de aynı yerde duruyor, çünkü onu da yerinde
        sanıyorsun.
      motto: Yerinde duranı da bir yokla.

  - id: inwardly
    profile: uyumluluk ↑ · dışadönüklük ↓ · duygusal tepkisellik ↑
    tr:
      name: İçten İçe
      summary: >-
        Kimseye söylemeden çok şey taşıyorsun; birinin canı sıkkınsa sen zaten
        fark etmişsindir. Bedeli şu: fark ettiğini söylemediğin için yardım hep
        tek yönlü akıyor, ve bir gün sana lazım olduğunda kimsenin aklına
        gelmiyorsun.
      motto: Ben de söyleyebilirim.
