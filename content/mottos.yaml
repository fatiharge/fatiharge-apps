# Four mottos per archetype, with what each one means and the line it becomes
# on a lock screen.
#
# A motto is a stance, not an instruction — "Acele etmeyen ama durmayan", never
# "Her gün çalış". The difference matters because the instruction version is
# advice, and advice from an app is the thing people mute first.
#
# Three parts, and all three are needed:
#   motto    — what someone would screenshot.
#   detail   — why this one, and what it costs. Same rule as an archetype
#              summary: a line that only flatters is not finished.
#   reminder — what it says when it arrives as a notification. Short enough to
#              read on a lock screen without opening anything.
#
# `archetypes.yaml` carries one motto each as the archetype's own line. These
# are the pool a claim draws from; the first of each set is that same line, so
# the card and the first day agree.

version: 1

mottos:
  # Sessiz İnşacı
  - id: qb1
    archetype: quiet_builder
    tr:
      motto: Acele etmeyen ama durmayan.
      detail: >-
        Hızlanmak sana bir şey kazandırmıyor, durmak her şeyi kaybettiriyor.
        Bedeli, ilerlediğini uzun süre kimsenin — bazen senin bile — fark
        etmemesi.
      reminder: Bugün de bir taş.
  - id: qb2
    archetype: quiet_builder
    tr:
      motto: İlk taşı ben biliyorum.
      detail: >-
        Duvarı herkes görür, nereden başladığını sen bilirsin. Bunu bilmek
        yeterli olmalı; çoğu zaman olmuyor ve bu yorucu.
      reminder: Nereden başladığını hatırla.
  - id: qb3
    archetype: quiet_builder
    tr:
      motto: Gösterebileceğim kadarı yeter.
      detail: >-
        Bitmemiş bir şeyi göstermek sana yanlış geliyor. Ama hiç göstermezsen
        hakkın da teslim edilmiyor — bu ikisi arasında bir yer var.
      reminder: Bugünlük bu kadarı görünsün.
  - id: qb4
    archetype: quiet_builder
    tr:
      motto: Sessizlik yavaşlık değil.
      detail: >-
        Ses çıkarmadan çalışmak, az çalışmak sanılıyor. Doğrusunu bilmek senin
        işine yarar; başkasına anlatmak da bazen gerekiyor.
      reminder: Sessiz ama duruyor.

  # Kıvılcım
  - id: sp1
    archetype: spark
    tr:
      motto: Bugün sadece bir tanesi.
      detail: >-
        Fikirlerin kötü değil, fazla. Seçmek eleme değil vazgeçme olduğu için
        zor — ve vazgeçmediğin sürece hiçbiri ilerlemiyor.
      reminder: Bir tanesi. Sadece bugün.
  - id: sp2
    archetype: spark
    tr:
      motto: Tutuşturmak kolay, taşımak marifet.
      detail: >-
        Başlangıçta iyisin ve bunu biliyorsun. Asıl mesele heyecan bittikten
        sonra kalan kısım, ki orası sıkıcı olduğu için yürüyor.
      reminder: Heyecan bitti, iş duruyor.
  - id: sp3
    archetype: spark
    tr:
      motto: Yaz ve bırak.
      detail: >-
        Yeni fikir gelmesini engelleyemezsin, peşinden gitmeyi
        erteleyebilirsin. Bir yere yazılan fikir kaçmıyor; kovalanan fikir
        bugünü yiyor.
      reminder: Yazdın mı? Yeter.
  - id: sp4
    archetype: spark
    tr:
      motto: Kaçıncı gün, kaç fikir değil.
      detail: >-
        Sende ölçü hep üretilen sayıydı. Bu sefer ölçü aynı şeye kaçıncı kez
        döndüğün — daha az heyecanlı ama daha çok işe yarıyor.
      reminder: Aynı şeye bir kez daha dön.

  # Gece Nöbetçisi
  - id: nw1
    archetype: night_watch
    tr:
      motto: Tetikte olmak da bir güç, dinlenmek de.
      detail: >-
        Önceden görmen defalarca işe yaradı, o yüzden bırakmıyorsun. Ama nöbet
        her gün tutulmuyor ve bunu kimse sana söylemiyor.
      reminder: Bugün nöbet yok.
  - id: nw2
    archetype: night_watch
    tr:
      motto: Listenin tamamı bugünün işi değil.
      detail: >-
        Ters gidebilecek her şeyi zaten düşündün. Hepsini bugün çözmeye
        çalışmak, hiçbirini çözmemekle aynı yere çıkıyor.
      reminder: Bir madde. Bugünlük o kadar.
  - id: nw3
    archetype: night_watch
    tr:
      motto: Bir gün affedilir.
      detail: >-
        Kaçırdığın gün değil, kaçırdıktan sonra kurduğun senaryo yoruyor.
        Zincir bir günü affediyor — sen genelde affetmiyorsun.
      reminder: Bir gün bir şey değiştirmez.
  - id: nw4
    archetype: night_watch
    tr:
      motto: Hazırlık da bir iş, o da bitiyor.
      detail: >-
        Hazırlanmak sende hiç bitmiyor çünkü her zaman bir ihtimal daha var.
        Bir yerde durmak, hazırlıksız kalmak değil.
      reminder: Yeterince hazırsın.

  # Sofra Kuran
  - id: ts1
    archetype: table_setter
    tr:
      motto: Onlardan önce bir de bana sor.
      detail: >-
        Herkesin iyi hissetmesini ayarlarken sıra sana gelmiyor. Bu bir
        fedakârlık değil, alışkanlık — ve alışkanlıklar değişebiliyor.
      reminder: Bugünkü dakika senin.
  - id: ts2
    archetype: table_setter
    tr:
      motto: Kendime verdiğim söz de sözdür.
      detail: >-
        Başkasına verdiğin sözü tutuyorsun. Kendine verdiğini bozarken
        kimseden özür dilemediğin için bedava geliyor; gelmiyor.
      reminder: Söz vermiştin.
  - id: ts3
    archetype: table_setter
    tr:
      motto: Masayı kuran da oturur.
      detail: >-
        İnsanları bir araya getirmek senin işin oldu. Sofrada kendine yer
        ayırmak, o işi bırakmak anlamına gelmiyor.
      reminder: Otur.
  - id: ts4
    archetype: table_setter
    tr:
      motto: Bunu kimseye anlatmak zorunda değilim.
      detail: >-
        Yaptığın çoğu şeyin bir izleyicisi var. Bunun yok, ve olmaması onu
        değersiz yapmıyor — sadece sessiz yapıyor.
      reminder: Kimse görmese de olur.

  # İnce İşçi
  - id: fw1
    archetype: fine_worker
    tr:
      motto: Mükemmel değil, bitmiş olsun.
      detail: >-
        Yarım kalanların çoğu tembellikten değil standardından yarım kaldı.
        Standart iyi bir şey; her yerde aynı standardı uygulamak değil.
      reminder: Bitmiş olsun, yeter.
  - id: fw2
    archetype: fine_worker
    tr:
      motto: Şimdilik böyle.
      detail: >-
        "Böyle olmaz" cümlesi işi durduruyor, "şimdilik böyle" ilerletiyor.
        İkisi de geçici, biri ilerleme bırakıyor.
      reminder: Şimdilik yeter.
  - id: fw3
    archetype: fine_worker
    tr:
      motto: Farkı ben görüyorum, bugün görmeyeyim.
      detail: >-
        Kimsenin görmediği farkı görmek bir yetenek ve bir yük. Bugünlük yükü
        bırakmak, yeteneği kaybetmek değil.
      reminder: Bugün bakma.
  - id: fw4
    archetype: fine_worker
    tr:
      motto: Bir kademe aşağısı da iş görür.
      detail: >-
        En iyisini yapmak zaman alıyor ve o zaman başka bir şeyden çalınıyor.
        Neyin en iyi olması gerektiğini seçmek de bir ustalık.
      reminder: Bir kademe aşağı.

  # Yön Veren
  - id: cp1
    archetype: compass
    tr:
      motto: Karar vermek de bir yük, taşıyorum.
      detail: >-
        Kimse karar vermeyince sen veriyorsun ve genelde doğru çıkıyor.
        Bedeli, taşıdığın şeyin ağırlığını kimsenin görmemesi — küçük kararlar
        dahil.
      reminder: Bugünkü karar küçük. Yine de sende.
  - id: cp2
    archetype: compass
    tr:
      motto: Bu sefer kimseyi ikna etmeyeceğim.
      detail: >-
        Herkesi beklemeden yürüyorsun ve genelde haklı çıkıyorsun. Bugünkü işin
        kimseyi ilgilendirmiyor; ikna edilecek tek kişi sensin.
      reminder: Sadece seni ilgilendiriyor.
  - id: cp3
    archetype: compass
    tr:
      motto: Bırak ilerlesin.
      detail: >-
        Yavaş gideni hızlandırma refleksin var. Bazı şeyler müdahaleyle değil,
        zamanla ilerliyor — ve beklemek sende en zor kısım.
      reminder: Bugün karışma.
  - id: cp4
    archetype: compass
    tr:
      motto: Yön göstermek de yoruyor.
      detail: >-
        Kimse senden istemedi ama sen yapıyorsun. Yorulmanın sebebi iş değil,
        işin kime ait olduğunun hiç konuşulmaması.
      reminder: Bugünkü yön seninki.

  # Durgun Su
  - id: sw1
    archetype: still_water
    tr:
      motto: Sakinim, kayıtsız değil.
      detail: >-
        Telaşa kapılmaman umursamamak sanılıyor. Aynı sakinlik ertelemeyi de
        rahatsız edici olmaktan çıkarıyor — asıl dikkat etmen gereken yer
        orası.
      reminder: Sakin ol ama bugün yap.
  - id: sw2
    archetype: still_water
    tr:
      motto: Sakinliğin bir bedeli var.
      detail: >-
        Çevrendekiler senin sakinliğinden faydalanıyor. Bunun sana neye mal
        olduğunu genelde sadece sen biliyorsun ve söylemiyorsun.
      reminder: Bugün kendine de bak.
  - id: sw3
    archetype: still_water
    tr:
      motto: Kendimi biraz rahatsız edeyim.
      detail: >-
        Kimseyi rahatsız etmeden yaşamayı beceriyorsun. Değişim tam olarak
        rahatsızlığın olduğu yerde oluyor.
      reminder: Küçük bir rahatsızlık.
  - id: sw4
    archetype: still_water
    tr:
      motto: Durgun, ama duruyor.
      detail: >-
        Dışarıdan hareketsiz görünmek durmakla karıştırılıyor. Aradaki farkı
        bilen tek kişi sensin; bugün onu doğru tarafta tut.
      reminder: Duruyorsun.

  # Derin Dalgıç
  - id: dd1
    archetype: deep_diver
    tr:
      motto: Derinde kalmak değil, dalıp çıkmak.
      detail: >-
        Bir konuya girdiğinde dibine gidiyorsun; orada kalmak da kolay.
        Değerli olan derinlik değil, geri çıkıp bir şey getirebilmen.
      reminder: Dal, sonra çık.
  - id: dd2
    archetype: deep_diver
    tr:
      motto: Anlamadan da yapılır.
      detail: >-
        Anlamadığın bir şeyi yapmak sana ters geliyor. Ama bazı şeyler
        yapıldıkça anlaşılıyor, öncesinde değil.
      reminder: Anlamı sonra gelecek.
  - id: dd3
    archetype: deep_diver
    tr:
      motto: Hazır olacağım gün yok.
      detail: >-
        Hazır hissettiğinde başlamayı seviyorsun. O his gelmiyor; gelenler
        başlamış olanlar.
      reminder: Bugün başla.
  - id: dd4
    archetype: deep_diver
    tr:
      motto: Yüzeyde de bir şeyler oluyor.
      detail: >-
        Derinde olan biteni görüyorsun, yüzeydekini kaçırıyorsun. Kaçırdığın
        şeylerin çoğu orada duruyor.
      reminder: Bir dakika yukarı çık.

  # Kendi Saatinde
  - id: oc1
    archetype: own_clock
    tr:
      motto: Kendi saatimde ama her gün.
      detail: >-
        Saatini değiştirmene gerek yok, her gün olmasına var. Bedeli, ilhamın
        gelmediği günlerde de küçük bir şey yapmayı kabul etmek.
      reminder: Bugün de kendi saatinde.
  - id: oc2
    archetype: own_clock
    tr:
      motto: Dalga geçtiğinde de kıyıdayım.
      detail: >-
        İyi günde çok, kötü günde az — ama ikisinde de var. Bedeli, az olan
        günü bir başarısızlık saymamayı öğrenmek.
      reminder: Az da olsa bugün de.
  - id: oc3
    archetype: own_clock
    tr:
      motto: Sistem değil, bugün.
      detail: >-
        Sana kurulacak düzen yaramıyor; yarayan tek şey bugünün kendisi.
        Bedeli, yarını kimsenin — senin de — kestirememesi.
      reminder: Sadece bugün. Yeter.
  - id: oc4
    archetype: own_clock
    tr:
      motto: Biriktirmeyi yeni öğreniyorum.
      detail: >-
        Şimdiye kadar biriken bir şey olmadı ve bu bir kusur değil, bir
        alışkanlık boşluğu. Bedeli, ilk iki haftanın sıkıcı geçmesi.
      reminder: Bir gün daha ekle.

  # Aykırı
  - id: ct1
    archetype: contrarian
    tr:
      motto: Karşı çıkmak kolay, sürdürmek zor.
      detail: >-
        İtiraz etmek sana bedavaya geliyor; asıl mesele itiraz ettiğin şeyin
        yerine bir şey koyup onu sürdürmek. Bedeli, haklı olmanın yetmediğini
        kabul etmek.
      reminder: Bugün sürdür.
  - id: ct2
    archetype: contrarian
    tr:
      motto: Kimseye değil, kendime söz verdim.
      detail: >-
        Başkasının kurduğu düzen sende tutmuyor, kendi kurduğun tutabilir.
        Bedeli, tutmadığında suçlayacak kimsenin olmaması.
      reminder: Sözün sana.
  - id: ct3
    archetype: contrarian
    tr:
      motto: Uymuyorum, kaçmıyorum.
      detail: >-
        Katılmamak bir duruş, ortadan kaybolmak değil. Bedeli, kalıp
        tartışmanın kaçmaktan daha yorucu olması.
      reminder: Bugün kal ve yap.
  - id: ct4
    archetype: contrarian
    tr:
      motto: Ham hâlim, işlenmiş hâlimden dürüst.
      detail: >-
        Cilalamadığın için insanlar seninle nerede olduklarını biliyor. Bedeli,
        cilanın bazen kapı açtığı yerlerde kapının kapalı kalması.
      reminder: Olduğun gibi, ama bugün yap.

  # Ayağı Yerde
  - id: fg1
    archetype: feet_on_ground
    tr:
      motto: Bugün elimde olanla.
      detail: >-
        Hazırlık beklemiyorsun, elindekiyle başlıyorsun ve bu çoğu insanın
        yapamadığı şey. Bedeli, elindeki hep aynı kaldığı için sonucun da aynı
        kalması.
      reminder: Elindekiyle başla.
  - id: fg2
    archetype: feet_on_ground
    tr:
      motto: Küçük bir şeyi değiştirmek de değişimdir.
      detail: >-
        Büyük planlar sende çalışmıyor; tek bir ayrıntı çalışıyor. Bedeli, tek
        ayrıntının sonucu göstermesinin haftalar sürmesi.
      reminder: Bir şeyi değiştir.
  - id: fg3
    archetype: feet_on_ground
    tr:
      motto: Yaparak öğrenirim, okuyarak değil.
      detail: >-
        Anlatılan şey sende tutmuyor, yapılan tutuyor. Bedeli, aynı hatayı bir
        kere yapmadan öğrenememek.
      reminder: Bugün yaparak öğren.
  - id: fg4
    archetype: feet_on_ground
    tr:
      motto: Merak etmesem de deneyebilirim.
      detail: >-
        Yeni olan seni çekmiyor ve çekmesine gerek de yok — denemek merak
        gerektirmiyor. Bedeli, ilk denemenin garip hissettirmesi.
      reminder: Merak etmeden dene.

  # Olduğu Gibi
  - id: ai1
    archetype: as_is
    tr:
      motto: Az kişiye açık, onlara tamamen.
      detail: >-
        Herkese biraz olmaktansa birkaç kişiye tamamen olmayı seçiyorsun.
        Bedeli, o birkaç kişi meşgulken kimsenin kalmaması.
      reminder: Bugün bir kişiye yaz.
  - id: ai2
    archetype: as_is
    tr:
      motto: Evetim evet, hayırım hayır.
      detail: >-
        Kimseyi idare etmediğin için sözün karşılığı var. Bedeli, idare edilmeyi
        bekleyen insanların bir daha gelmemesi.
      reminder: Bugünkü sözün sana.
  - id: ai3
    archetype: as_is
    tr:
      motto: Yalnızlık değil, seçicilik.
      detail: >-
        Uzak durman bir eksiklik değil, bir tercih — ama tercih olduğunu ara
        ara kontrol etmek gerekiyor. Bedeli, kontrol etmeyi unuttuğunda
        tercihin alışkanlığa dönüşmesi.
      reminder: Bugün bir kere kontrol et.
  - id: ai4
    archetype: as_is
    tr:
      motto: Kendim için yapıyorum, kimse görmese de.
      detail: >-
        Motivasyonun dışarıdan gelmiyor, bu yüzden dışarıdan da bozulmuyor.
        Bedeli, tıkandığında kimsenin fark etmemesi.
      reminder: Kendin için, bugün de.

  # Masayı Deviren
  - id: tu1
    archetype: table_upsetter
    tr:
      motto: Söylemesi kolaydı, kalması değil.
      detail: >-
        Doğru cümleyi kurmak sende bir cesaret işi değil, bir refleks. Asıl iş
        ondan sonra başlıyor ve bedeli şu: söyleyip çıkarsan haklı olman da
        kimsenin işine yaramıyor.
      reminder: Bugün söylediğinin yanında kal.
  - id: tu2
    archetype: table_upsetter
    tr:
      motto: Masayı devirdiysem toplarım.
      detail: >-
        Kırdığın şeyi sen de görüyorsun, sadece kırmaya değer olduğunu
        düşünüyorsun. İkisi birden doğru olabilir; toplamayı da işin parçası
        say.
      reminder: Bugün bir tanesini topla.
  - id: tu3
    archetype: table_upsetter
    tr:
      motto: Sesimi değil, sırayı ayarlıyorum.
      detail: >-
        Söylediğin şeyin yanlış olduğu nadir; zamanlaması genelde. Aynı cümle
        beş dakika sonra kurulduğunda kimse savunmaya geçmiyor.
      reminder: Aynı şeyi, beş dakika sonra.
  - id: tu4
    archetype: table_upsetter
    tr:
      motto: Katılmıyorum, ama buradayım.
      detail: >-
        Karşı çıkmak seni odadan çıkarmak zorunda değil. Bunu söylemek zor
        geliyor çünkü kalmak, itiraz etmekten daha çok şey istiyor senden.
      reminder: Katılma, ama kalmaya devam et.

  # Hafif Ayaklı
  - id: lf1
    archetype: light_footed
    tr:
      motto: Taşımadan da gidilir, ama bunu değil.
      detail: >-
        Yükü bırakabilmek senin en rahat özelliğin. Bedeli şu: bırakılmaması
        gereken şeyi de aynı kolaylıkla bırakıyorsun ve bunu aylar sonra fark
        ediyorsun.
      reminder: Bugün bırakmayacağın şeyi seç.
  - id: lf2
    archetype: light_footed
    tr:
      motto: Sakinliğim bir cevap değil.
      detail: >-
        Telaşlanmaman etrafındakileri rahatlatıyor. Ama bazen insanların
        ihtiyacı rahatlamak değil, ciddiye alındığını görmek.
      reminder: Bugün birine "ciddi bu" de.
  - id: lf3
    archetype: light_footed
    tr:
      motto: Kolay geldi diye küçük değil.
      detail: >-
        Zorlanmadan yaptığın şeyi kendi gözünde küçültüyorsun. Bir şeyin
        değeri, sana kaça mal olduğuyla ölçülmüyor.
      reminder: Kolay yaptığın şeyi de say.
  - id: lf4
    archetype: light_footed
    tr:
      motto: Bugün de aynı yerden geçeyim.
      detail: >-
        Her yerden rahat geçtiğin için hiçbir yerde iz bırakmıyorsun. Aynı
        yere ikinci kez uğramak, senin için tekrar değil birikim.
      reminder: Dün nereye uğradıysan, bugün de.

  # Dolu Bardak
  - id: fu1
    archetype: full_glass
    tr:
      motto: Bir yudum boşalt, sonra taşı.
      detail: >-
        Elindeki her şey aynı anda acil görünüyor ve bu bir dikkat sorunu
        değil, bir doluluk sorunu. Bedeli şu: boşaltmadığın sürece hiçbirine
        sıra gelmiyor.
      reminder: Bugün bir tanesini bırak.
  - id: fu2
    archetype: full_glass
    tr:
      motto: Hissetmem, yapamayacağım demek değil.
      detail: >-
        Bir şeyi yoğun hissetmek sende çoğu zaman erteleme olarak çıkıyor.
        Aradaki bağ zorunlu değil; hissederken de yapılabiliyor.
      reminder: Şu an nasılsan öyle başla.
  - id: fu3
    archetype: full_glass
    tr:
      motto: Küçük olsun, bitmiş olsun.
      detail: >-
        Büyük planlar seni rahatlatıyor ve sonra aynı planlar üzerine
        yıkılıyor. Bitmiş küçük bir şey, planlanmış büyük bir şeyden daha çok
        taşıyor seni.
      reminder: Beş dakikalık olanı seç.
  - id: fu4
    archetype: full_glass
    tr:
      motto: Bugünü kurtarmak yeterli.
      detail: >-
        İleriyi düşünmek sende hazırlık değil, yorgunluk üretiyor. Bugünle
        sınırlı kalmak bir küçülme değil; taşımayı sürdürebilmenin yolu.
      reminder: Sadece bugün. Yarını yarın.

  # Sözü Senet
  - id: wb1
    archetype: word_is_bond
    tr:
      motto: Söz verdiğim kadarı, o kadarı da tam.
      detail: >-
        Verdiğin sözün tutulacağını herkes biliyor. Bedeli şu: ne kadar söz
        verdiğine kimse bakmıyor, senin de bakman gerekiyor.
      reminder: Bugün ne kadarına söz verdin?
  - id: wb2
    archetype: word_is_bond
    tr:
      motto: Hayır demek de bir söz.
      detail: >-
        "Yapamam" cümlesini kurmadığın için insanlar sormaya devam ediyor. O
        cümle bir kırgınlık değil, senin güvenilirliğinin devamı.
      reminder: Bugün bir tanesine hayır de.
  - id: wb3
    archetype: word_is_bond
    tr:
      motto: Sıraya ben de varım.
      detail: >-
        Kendi işini herkesinki bittikten sonraya koyuyorsun ve o an genelde
        gelmiyor. Sıraya girmek bencillik değil, sıranın var olması demek.
      reminder: Bugün sırayı kendinden başlat.
  - id: wb4
    archetype: word_is_bond
    tr:
      motto: Taşıyorum, ama görünsün.
      detail: >-
        Yükü sessizce almak sana doğal geliyor. Kimse ağırlığını bilmediği için
        de azalmıyor — söylemek şikâyet değil, bilgi.
      reminder: Bugün taşıdığın şeyi bir kişiye söyle.

  # Yerli Yerinde
  - id: ip1
    archetype: in_its_place
    tr:
      motto: Yerinde duranı da bir yokla.
      detail: >-
        İşleyen şeyi bozmamak senin en sağlam tarafın. Bedeli şu: bozulmuş
        olanı da yerinde sanıyorsun, çünkü uzun süredir orada.
      reminder: Bugün bir şeyi yokla.
  - id: ip2
    archetype: in_its_place
    tr:
      motto: Denenmişi seçtim, denemediğimi bilerek.
      detail: >-
        Bildiğin yol seni yanıltmıyor. Yine de bir tercih olduğunu hatırlamak,
        onu alışkanlık olmaktan çıkarıp karar yapıyor.
      reminder: Bu, seçim mi alışkanlık mı?
  - id: ip3
    archetype: in_its_place
    tr:
      motto: Bir kere de başka türlü.
      detail: >-
        Değişiklik sana masraf gibi geliyor ve çoğu zaman haklısın. Ama küçük
        bir sapma, kaybedecek bir şeyin olmadığı yerde ucuz.
      reminder: Bugün bir şeyi başka türlü yap.
  - id: ip4
    archetype: in_its_place
    tr:
      motto: Sağlamlığım kimseye yük değil.
      detail: >-
        Etrafındakiler sana göre plan yapabiliyor ve bunu sen de biliyorsun.
        Yalnız şu var: hep aynı yerde durmak, kimsenin sana yeni bir şey
        sormamasına da yol açıyor.
      reminder: Bugün sana ne sorulsun isterdin?

  # İçten İçe
  - id: iw1
    archetype: inwardly
    tr:
      motto: Ben de söyleyebilirim.
      detail: >-
        Başkasının halini okumak sende otomatik. Kendi halini söylemek değil —
        ve söylemediğin sürece kimse sormuyor.
      reminder: Bugün bir cümle de kendin için.
  - id: iw2
    archetype: inwardly
    tr:
      motto: Fark ettim, artık söylüyorum.
      detail: >-
        Fark etmek yardım etmenin yarısı; diğer yarısı söylemek. İkincisini
        atladığında yükü tek başına taşımış oluyorsun.
      reminder: Fark ettiğin şeyi bugün söyle.
  - id: iw3
    archetype: inwardly
    tr:
      motto: Yakınlık iki taraflı.
      detail: >-
        Verdiğin ilgiyi geri istemeyi zorlama sanıyorsun. İstenmediği sürece
        gelmeyen şeye zorlama denmiyor, yakınlık deniyor.
      reminder: Bugün birinden bir şey iste.
  - id: iw4
    archetype: inwardly
    tr:
      motto: İçeride kalırsa büyüyor.
      detail: >-
        Söylenmeyen şey sende küçülmüyor, birikiyor. Söylemek onu çözmüyor ama
        büyümesini durduruyor.
      reminder: Bugün birini içeriden çıkar.
