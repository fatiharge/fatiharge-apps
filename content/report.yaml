# The two reports, in pieces.
#
# There are two, and they are different documents rather than one document and
# its teaser:
#
#   Rapor (free)       overview + five dimension readings + strength + cost.
#                      What the reader is. Whole on its own.
#   Derin rapor (paid) portrait + four sections woven from a skeleton, the
#                      reader's band on that section's dimension and an
#                      archetype fragment + comparison + limitation.
#                      What it means and what to do about it.
#
# Assembled against the profile, not looked up by archetype: two people with
# the same archetype land on different bands and read different reports. That
# difference is what the deep one is worth paying for.
#
# Only the parts that are the same for everybody are written here — the four
# section skeletons and the limitations. The rest is generated as placeholders
# and replaced one at a time, findable by
# `select kind, archetype_id, dimension, band, section from report_pieces
#  where placeholder`.

version: 1

# Where the writing goes. Each of these is optional and partial — a key that is
# not here is pushed as a marked stand-in, so the file can be filled one entry
# at a time:
#
#   readings:      DIMENSION: {low|mid|high: {tr: …}}   free report
#   dimensions:    DIMENSION: {low|mid|high: {tr: …}}   deep report
#   overviews:     archetype_id: {tr: …}                free report
#   strengths:     archetype_id: {tr: …}                free report
#   costs:         archetype_id: {tr: …}                free report
#   portraits:     archetype_id: {tr: …}                deep report
#   comparisons:   archetype_id: {tr: …}                deep report
#   fragments:     archetype_id: {1..4: {tr: …}}        deep report


# The shape of every report. Each section takes a dimension reading and an
# archetype fragment; the skeleton is what holds them together.
sections:
  - section: 1
    tr: >-
      Bu bölüm nasıl karar verdiğinle ilgili — neye bakarak, neyi atlayarak.
  - section: 2
    tr: >-
      Bu bölüm başkalarıyla olan kısmın: yakınlaşma, mesafe ve ikisi arasında
      durduğun yer.
  - section: 3
    tr: >-
      Bu bölüm iş bittiğinde değil, ortasında ne yaptığınla ilgili.
  - section: 4
    tr: >-
      Bu bölüm sana ne pahalıya mal olduğuyla ilgili. Güçlü tarafın bedava
      gelmiyor.
  - section: 5
    tr: >-
      Bu bölüm ikinizin aynı anda haklı olamadığı anlarla ilgili: nerede
      bırakıyor, nerede tutuyorsun.

limitation:
  tr: >-
    Bu rapor yirmi maddelik bir envanterden çıkıyor. Kısa form kaba çözünürlük
    verir, özbildirim yanlıdır, ve arketip sınırları keskin değildir. Buradaki
    hiçbir cümle bir teşhis değil; beş boyutlu bir profilin okunabilir hâli.

# ---------------------------------------------------------------------------
# Rapor (ücretsiz)
# ---------------------------------------------------------------------------

# Beş eksen, arketipten bağımsız. Buraya arketip adı girmez: aynı arketipteki
# iki kişi farklı bantlara düşer ve farklı okur — raporu kişiye ait yapan şey
# bu. Her bant bir bedel söyler; yalnız öven bant, kimsenin ikinci kez
# okumadığı banttır.
readings:
  OPENNESS:
    low:
      tr: >-
        Bildiğin yoldan gitmeyi seçiyorsun ve bu genelde işini görüyor. Yeni bir
        şey seni heyecanlandırmıyor; önce ne kadar dağıtacağını hesaplıyorsun.
        Bedeli şu: sana çok yakışacak şeylere de geç kalıyorsun, çünkü sıraya
        girmeden önce kanıt istiyorsun.
    mid:
      tr: >-
        Yeni olana kapalı değilsin ama peşinden de koşmuyorsun. Bir şey önüne
        geldiğinde deniyorsun, kendi başına aramaya çıkmıyorsun. Bu dengeli
        duruşun görünmeyen tarafı şu: seçimi çoğunlukla başkalarının önüne ne
        koyduğu belirliyor.
    high:
      tr: >-
        Alışılmışın dışındaki şey seni yormuyor, çekiyor. Bir fikri denemeden
        bırakmak sana israf gibi geliyor. Bedeli şu: yarım kalan şeylerin sayısı
        seni rahatsız edecek kadar çok, çünkü her yeni kapı eskisinden daha
        parlak görünüyor.
  CONSCIENTIOUSNESS:
    low:
      tr: >-
        Plan yapıp ona uymak sende zorlukla değil, sıkıntıyla karşılanıyor.
        İşler genelde son anda ve bir hamlede oluyor — ve çoğu zaman oluyor.
        Bedeli şu: her seferinde baştan başlamak yorucu, ve biriken şey olmuyor.
    mid:
      tr: >-
        Düzenin var ama kutsal değil. Önemli olana sadık kalıyor, gerisini
        akışına bırakıyorsun. Bunun sessiz tarafı şu: neyin önemli olduğuna karar
        vermeyi ertelediğin günlerde ikisi de yapılmıyor.
    high:
      tr: >-
        Başladığın işi bitiriyorsun ve bunu kimse kontrol etmediğinde de
        yapıyorsun. Söz verdiğin şey oluyor. Bedeli şu: plan bozulduğunda
        esnemek yerine geriliyorsun, ve dinlenmeyi de bir göreve çevirmediğin
        sürece dinlenmiyorsun.
  EXTRAVERSION:
    low:
      tr: >-
        Kalabalık seni doldurmuyor, boşaltıyor. Az kişiyle derin konuşmak, çok
        kişiyle kısa konuşmaya her gün tercihin. Bedeli şu: odada olmadığın için
        senin hakkında verilen kararların bir kısmını sonradan öğreniyorsun.
    mid:
      tr: >-
        İnsanların arasında rahatsın ama oradan beslenmiyorsun. Bir süre sonra
        kendi başına kalman gerekiyor ve bu ihtiyacın belirsizliği kafa
        karıştırıyor — hem çağrılıyorsun hem yorulduğun anlaşılmıyor.
    high:
      tr: >-
        Enerjini insanlardan alıyorsun; konuşurken düşünüyor, anlatırken
        anlıyorsun. Bedeli şu: yalnız kalmak sana boşluk gibi geliyor, ve bazı
        şeyler ancak yalnızken bitiyor.
  AGREEABLENESS:
    low:
      tr: >-
        Hayır demek sende bir mesele değil. Katılmadığın şeyi katılıyormuş gibi
        yapmıyorsun ve bu, etrafındakilerin nerede durduğunu bilmesini
        kolaylaştırıyor. Bedeli şu: haklı olduğun konuşmalardan bile kırgın
        insanlar çıkıyor.
    mid:
      tr: >-
        Çoğu zaman uzlaşıyor, gerektiğinde diretiyorsun. Bu ayarı tutturmak
        yorucu değil ama görünmez: ne kadar taviz verdiğini kimse bilmiyor,
        çünkü hiçbirini yüksek sesle vermiyorsun.
    high:
      tr: >-
        İnsanların arasını iyi tutmak senin işin — istenmeden, karşılıksız.
        Bedeli şu: kendi ihtiyacını sıraya en son koyuyorsun ve sıra çoğu zaman
        sana gelmiyor. Bu bir incelik, ama faturası sana kesiliyor.
  NEUROTICISM:
    low:
      tr: >-
        Bir şey ters gittiğinde önce sakin kalıyorsun ve bu, etrafındakileri de
        sakinleştiriyor. Bedeli şu: gerçekten sorun olan şeyi de geç fark
        ediyorsun, çünkü ilk tepkin telaş değil, bekleme.
    mid:
      tr: >-
        Sarsılıyorsun ama devrilmiyorsun. Kötü bir gün gününü bozuyor, haftanı
        bozmuyor. Bunun sessiz maliyeti şu: toparlandığın için kimse ne kadar
        zorlandığını sormuyor.
    high:
      tr: >-
        Bir şeyin ters gideceğini herkesten önce hissediyorsun ve çoğu zaman
        haklı çıkıyorsun. Bedeli şu: haklı çıkmadığın zamanlar da aynı yorgunluğu
        ödüyorsun, çünkü beden tehlikeyi gerçekleşmeden yaşıyor.

# Serbest raporun açılışı: okuyucuya kim olduğunu söyler, ne yapması
# gerektiğini değil. Bir paragraf.
overviews:
  quiet_builder:
    tr: >-
      Sen, ilerlemenin görünmediği yerde ilerleyen birisin. Bir şeyi duyurmadan
      önce sağlam olmasını istiyorsun, o yüzden yaptığın işin çoğu bitmeden
      kimsenin haberi olmuyor. Bu, sana güvenilmesinin de görülmemenin de aynı
      sebebi.
  spark:
    tr: >-
      Sen, fikrin bol olduğu birisin. Sorun ilgisizlik değil — başladığın her
      şey başladığın anda gerçekten iyi bir fikirdi. Zor olan tutuşturmak değil,
      birini seçip diğerlerinin sönmesine izin vermek.
  night_watch:
    tr: >-
      Sen, olacak olanı önceden gören birisin. Herkes rahatken senin çoktan
      düşünmüş olman defalarca işe yaradı ve kimse bunu sayamadı. Tetikte olmak
      bir beceri; sürekli tetikte olmak bir yük.
  table_setter:
    tr: >-
      Sen, insanların bir araya geldiği yeri kuran birisin. Kimse senden
      istemiyor, sen yapıyorsun. Etrafındakilerin iyi hissetmesi senin için
      arka plan değil, işin kendisi — ve tam da bu yüzden kendi ihtiyacın
      arka planda kalıyor.
  fine_worker:
    tr: >-
      Sen, farkı kimsenin görmediği yerde de gören birisin. "Olur böyle" cümlesi
      sende çalışmıyor. Yaptığın işin kalitesi bir tercih değil, bir eşik — ve o
      eşik bitirmeyi başlamaktan daha zor hale getiriyor.
  compass:
    tr: >-
      Sen, kimse karar vermeyince karar veren birisin. Belirsizlik odadaki
      herkesi beklerken sana bir şey yaptırıyor. Genelde doğru çıkıyorsun, ve
      herkesin katılmasını beklemediğin için bazen tek başına yürüyorsun.
  still_water:
    tr: >-
      Sen, telaşın yayılmadığı birisin. Etrafındaki insanlar farkında olmadan
      sana bakıp sakinleşiyor. Bu, taşıdığın en sessiz ve en işe yarar şey —
      ama sakinlik, bir şeyin gerçekten yanlış olduğunu söylemekte de yavaş.
  deep_diver:
    tr: >-
      Sen, her şeyi bir kat daha derinden yaşayan birisin; iyisini de kötüsünü
      de. Yüzeyde kalabilseydin daha rahat ederdin, ama o zaman fark ettiğin
      şeylerin çoğunu fark etmezdin. Mesele derinliği azaltmak değil, çıkmayı
      öğrenmek.

# "Bu sana ne veriyor" — övgü değil, işe yarayan tarafın adı.
  own_clock:
    tr: >-
      Sen, kendi ritmiyle çalışan birisin. Dalga geldiğinde bir günde
      başkalarının haftada yaptığını yapıyorsun, gelmediğinde hiçbir şey
      olmuyor. Bu bir disiplin eksikliği değil, farklı bir motor — ama
      biriktirmeyen bir motor.
  contrarian:
    tr: >-
      Sen, uymayı reddeden birisin — ne düzene ne de ortama.
      Katılıyormuş gibi yapmadığın için senden duyduğun şey gerçekten
      senin düşündüğün şey, ve bu, etrafındaki az sayıdaki dürüst
      kaynaktan biri olmanı sağlıyor.
  feet_on_ground:
    tr: >-
      Sen, bugünün işine bakan birisin. Teoriye ihtiyacın yok, plana da;
      elindekiyle çözüyorsun ve genelde çözülüyor. Bu, etrafındaki
      insanların en çok güvendiği ama en az konuştuğu türden bir beceri.
  as_is:
    tr: >-
      Sen, kendini pazarlamayan birisin. Yakınlık için uğraşmıyorsun,
      araları düzeltmek için de; seni tanıyan tam olarak seni tanıyor,
      çünkü gösterdiğin başka bir sen yok.
  table_upsetter:
    tr: >-
      Sen, odadaki sessizliği bozan birisin. Kimsenin söylemek istemediği şeyi
      söylüyorsun ve çoğu zaman söylenmesi gerekiyordu. Mesele cesaret değil:
      o cümleyi tutmak sende söylemekten daha zor. Bedeli, söyledikten sonraki
      kısımda ortaya çıkıyor.
  light_footed:
    tr: >-
      Sen, yükü üstünde bırakmayan birisin. Kalabalık seni yormuyor, aksilik
      seni sarsmıyor; ikisinin içinden de aynı rahatlıkla geçiyorsun. Bu senin
      en dinlendirici tarafın, ve hiçbir şeyin sende iz bırakmamasının da aynı
      sebebi.
  full_glass:
    tr: >-
      Sen, her şeyi aynı anda hisseden birisin. Elindekilerin hepsi aynı
      derecede acil görünüyor ve bu bir ilgi sorunu değil, bir doluluk sorunu.
      Yapabileceklerinin listesi uzun; hangisinin önce geleceğine karar vermek
      kısa değil.
  word_is_bond:
    tr: >-
      Sen, sözünün arkasında duran birisin. İnsanlar sana bir iş bıraktığında
      bir daha sormuyorlar, çünkü sormaya gerek olmadığını öğrendiler. Bu,
      etrafındaki herkesin işini kolaylaştırıyor ve seninkini en sona
      bırakıyor.
  in_its_place:
    tr: >-
      Sen, işleyen şeyi bozmayan birisin. Denenmişi denenmiş olduğu için
      seçiyorsun; bu seni sarsılmaz yapıyor ve etrafındakiler sana göre plan
      kurabiliyor. Aynı sağlamlık, değişmesi gereken şeyin de yerinde
      kalmasına yol açıyor.
  inwardly:
    tr: >-
      Sen, söylemeden fark eden birisin. Birinin canı sıkkınsa sen zaten
      görmüşsündür, ve genelde bir şey de yapmışsındır. Sıra kendi halinde
      olan bitene geldiğinde ise aynı hız kayboluyor.
strengths:
  quiet_builder:
    tr: >-
      Kimse bakmazken de aynı hızda gidiyorsun. Bu, uzun işlerde tek gerçek
      avantaj: motivasyonla değil, alışkanlıkla ilerleyen kişi altı ay sonra
      hâlâ orada oluyor.
  spark:
    tr: >-
      Bir şeyi başlatmak sana bedavaya geliyor. Çoğu insanın haftalarca
      ertelediği şeyi sen bir öğleden sonra deniyorsun, ve denenen fikir
      konuşulan fikirden her zaman daha çok şey öğretiyor.
  night_watch:
    tr: >-
      Riski erken görüyorsun. Herkes iyimserken senin sorduğun soru, sonradan
      kimsenin sormadığına pişman olduğu soru oluyor.
  table_setter:
    tr: >-
      İnsanları bir arada tutuyorsun ve bu, öğrenilmesi en zor beceri. Bir
      grubun dağılmamasının sebebi genelde kimsenin adını koymadığı biri oluyor;
      o sensin.
  fine_worker:
    tr: >-
      Standardın yüksek ve düşmüyor. Senin elinden çıkan şeyin bir daha kontrol
      edilmesi gerekmiyor — bu, zamanla insanların sana neyi emanet ettiğini
      değiştiriyor.
  compass:
    tr: >-
      Belirsizliği karara çeviriyorsun. Yanlış karar bile beklemekten iyidir
      diyebilen az kişi var, ve o kişi olmadan çoğu şey hiç başlamıyor.
  still_water:
    tr: >-
      Panik sende durup kalıyor, yayılmıyor. Kötü bir anda odadaki en işe yarar
      kişi, en çok bilen değil, en az telaşlanan oluyor.
  deep_diver:
    tr: >-
      Yüzeyin altını görüyorsun. Başkalarının "iyiyim" dediği yerde neyin
      olduğunu anlıyorsun, ve bu, insanların sana söylemedikleri şeyi söylemesini
      sağlıyor.

# "Neye mal oluyor" — ücretsiz raporda kalır, paranın arkasına saklanmaz.
# Sadece öven bir profil, kimsenin geri dönmediği profildir.
  own_clock:
    tr: >-
      Geldiğinde tamamen geliyorsun. Bir işe girdiğinde araya hiçbir şey
      sokmadan bitirebilmen, planla çalışan çoğu insanda olmayan bir
      yoğunluk.
  contrarian:
    tr: >-
      Kimseyi idare etmiyorsun. Bir odada herkesin katıldığı bir şeye
      katılmayan tek kişi olmak zor ve sen bunu düşünmeden yapıyorsun; o
      yüzden yanlış giden şeyler senin yanında daha erken söyleniyor.
  feet_on_ground:
    tr: >-
      Elindekiyle başlıyorsun. Çoğu insan hazır olmayı beklerken sen
      çoktan bir şey yapmış oluyorsun, ve yapılmış bir şey, planlanmış
      on şeyden fazla.
  as_is:
    tr: >-
      Sözünün karşılığı var. Kimseyi idare etmediğin için evet dediğinde
      evet oluyor, ve bu, insanların zamanla neyi sana emanet ettiğini
      değiştiriyor.
  table_upsetter:
    tr: >-
      Yanlış olduğunu bildiğin bir şeyin yanından sessizce geçemiyorsun. Çoğu
      ekipte bu iş kimsede yok: birinin ilk cümleyi kurması gerekiyor ve o
      cümlenin bedelini herkes biliyor. Ödeyen sensin.
  light_footed:
    tr: >-
      Kötü giden bir şey seni işlevsiz bırakmıyor. Etrafındakiler
      telaşlanırken senin hâlâ düşünebiliyor olman, bir kriz anında ekibe
      kattığın en somut şey — ve kimse bunu bir beceri olarak saymıyor, sen de
      dahil.
  full_glass:
    tr: >-
      Hissettiğin şeyin şiddeti, aynı zamanda fark ettiğin şeyin çözünürlüğü.
      Başkalarının gözünden kaçan şey senden kaçmıyor, çünkü sende hiçbir şey
      arka planda kalmıyor.
  word_is_bond:
    tr: >-
      Verdiğin söz tutuluyor, ve bu çevrende bir zemin oluşturuyor. İnsanların
      bir işi takip etmeden bırakabilmesi nadir bir güven; onu üreten sensin.
  in_its_place:
    tr: >-
      İşin sıkıcı ve tekrar eden kısmı sende aksamıyor. Heyecan bittiğinde çoğu
      insanın bıraktığı yerde sen aynı hızda devam ediyorsun, ve uzun işlerde
      belirleyici olan tam olarak bu.
  inwardly:
    tr: >-
      İnsanların söylemediği şeyi duyuyorsun. Bu bir incelik değil, bir
      çözünürlük meselesi: odadaki gerginliği senden önce kimse fark etmiyor,
      senden sonra herkes rahatlıyor.
costs:
  quiet_builder:
    tr: >-
      Görünmediğin için hakkın da teslim edilmiyor. Daha kötüsü, yardım
      istemeyi geciktiriyorsun: sessizce ilerlemek sessizce tıkanmayı da
      kolaylaştırıyor.
  spark:
    tr: >-
      Yarım kalanların sayısı seni yoruyor. Her yeni başlangıç bir öncekinin
      bitmediğini biraz daha kanıtlıyor, ve bir süre sonra başlamak da eskisi
      kadar iyi hissettirmiyor.
  night_watch:
    tr: >-
      Tehlikeyi gerçekleşmeden yaşıyorsun. Haklı çıkmadığın zamanlarda da aynı
      yorgunluğu ödüyorsun, ve dinlenmeyi bir görev listesine yazmadığın sürece
      dinlenmiyorsun.
  table_setter:
    tr: >-
      Sıra sana geldiğinde masada yer kalmıyor. Kimse seni dışarıda bırakmıyor —
      sen kendini en sona koyuyorsun, ve bunu o kadar doğal yapıyorsun ki
      kimsenin fark etmesi için bir sebep olmuyor.
  fine_worker:
    tr: >-
      Bitirmek sana başlamaktan pahalıya geliyor. "Yeterince iyi" eşiği sende
      çalışmadığı için, bitmiş ama mükemmel olmayan şey yerine bitmemiş şeyi
      seçiyorsun.
  compass:
    tr: >-
      Bazen yalnız yürüyorsun. Herkesin katılmasını beklemediğin için hız
      kazanıyor, destek kaybediyorsun — ve kararın doğruluğu, o desteğin
      eksikliğini kapatmıyor.
  still_water:
    tr: >-
      Sorun etmediğin için sorun büyüyor. Sakinlik, bir şeyin gerçekten yanlış
      olduğunu söylemeyi de erteliyor, ve söylendiğinde iş çoktan başkasının
      meselesi olmuş oluyor.
  deep_diver:
    tr: >-
      Çıkmakta zorlanıyorsun. Derine inmek bir seçim ama orada kalmak bir
      alışkanlık, ve iyi olan şeyi de kötü olan şeyi de aynı derinlikte
      taşımak günü uzatıyor.

# ---------------------------------------------------------------------------
# Derin rapor (ücretli)
# ---------------------------------------------------------------------------

# Bölüm iskeletinden sonra, arketip fragmanından önce okunur. Bu yüzden eksenin
# adıyla değil, bölümün sorusuyla başlar: 1 nasıl karar verdiğin, 2 başkalarıyla
# olan kısmın, 3 işin ortasında yaptığın, 4 neye mal olduğu.
#
# Uyumluluk şu an dört bölümün hiçbirine düşmüyor — eşleme puanlama tarafında
# sabit ve orada kalması doğru. Metni yine de burada: hangi eksenin hangi bölümü
# okuyacağı bir ürün kararı ve yeniden tartışılacak.
  own_clock:
    tr: >-
      Hiçbir şey birikmiyor. Her seferinde baştan başladığın için altı
      ay sonra elde kalan, altı gün sonra elde kalanla aynı — ve kimse
      sana göre plan yapamıyor, sen de dahil.
  contrarian:
    tr: >-
      Sonradan ihtiyacın olacak iyi niyeti bugün harcıyorsun. Haklı
      olduğun tartışmalardan bile kırgın insanlar çıkıyor, ve bir şeye
      ihtiyacın olduğunda arayacak kimse kalmıyor.
  feet_on_ground:
    tr: >-
      Hiçbir şey değişmiyor. Değişim ya merak ister ya plan, ve sen
      ikisini de taşımıyorsun — o yüzden beş yıl önce çalışan çözüm hâlâ
      kullanımda, çalışmayı bırakmış olsa bile.
  as_is:
    tr: >-
      Bir süre sonra kimse sormuyor. Uzak durman bir tercihti ama tercih
      olduğunu kontrol etmeyi bıraktığında alışkanlığa dönüşüyor — ve
      bunu ancak bir şeye ihtiyacın olduğunda fark ediyorsun.
  table_upsetter:
    tr: >-
      Söylediğin doğru, ama söyledikten sonra ortada kalan işi genelde başkası
      topluyor. Bir süre sonra insanlar seni dinlemiyor, bekliyor — ne
      diyeceğini değil, ne zaman geçeceğini. Kaybettiğin şey haklılık değil,
      etkinlik.
  light_footed:
    tr: >-
      Hiçbir şeyi büyütmediğin için gerçekten büyük olanı da geç fark
      ediyorsun. Bu, kendi başına gelenlerde değil, başkasının sana anlattığı
      şeylerde pahalıya patlıyor: ciddiye alınmayı bekleyen biri, sakinliğini
      ilgisizlik diye okuyor.
  full_glass:
    tr: >-
      Taşmamak için harcadığın enerji, işin kendisine ayıracağından fazla.
      Günün sonunda yorgunsun ve geriye bakınca yapılmış bir şey yok — o
      boşluk da ertesi günü daha ağır başlatıyor.
  word_is_bond:
    tr: >-
      Kimse senden "yapamam" duymadığı için sormaya devam ediyor. Sıra kendi
      işine geldiğinde gün bitmiş oluyor ve bunu kimse fark etmiyor, çünkü
      söylemiyorsun da. Bir gün durduğunda herkes şaşırıyor.
  in_its_place:
    tr: >-
      Bozulmuş olanı da yerinde sanıyorsun, çünkü uzun süredir orada.
      Ertelemenin maliyeti hemen görünmüyor; birikip bir anda geliyor, ve o an
      geldiğinde küçük bir düzeltme artık yetmiyor.
  inwardly:
    tr: >-
      Fark ettiğini söylemediğin için yardım tek yönlü akıyor. Yıllar içinde şu
      ortaya çıkıyor: bir şeye ihtiyacın olduğunda kimsenin aklına gelmiyorsun,
      çünkü hiç ihtiyacın olmamış gibi durdun.
dimensions:
  CONSCIENTIOUSNESS:
    low:
      tr: >-
        Karar anını uzatmıyorsun. Yeterince bilgi biriktiğinde değil, sıkıldığın
        anda seçiyorsun ve seçtikten sonra da geri dönüp bakmıyorsun. Bu, hızlı
        olmanın sebebi; aynı kararı üç ay sonra bir daha vermenin de sebebi.
    mid:
      tr: >-
        Önemli kararlarda yavaşlıyor, gerisini akışına bırakıyorsun. Ayrımı iyi
        yapıyorsun ama ayrımı yapmak da bir karar, ve yorgun olduğun günlerde
        her şey "gerisi" tarafına düşüyor.
    high:
      tr: >-
        Karar vermeden önce ne olacağını görmek istiyorsun ve genelde
        görüyorsun. Seçtiğin şeye sadık kalıyorsun. Bunun görünmeyen tarafı:
        yanlış olduğu ortaya çıkan bir karardan çıkmak, ona girmekten çok daha
        zor oluyor senin için.
  EXTRAVERSION:
    low:
      tr: >-
        Yakınlığı azaltarak değil, seyrelterek kuruyorsun. Az sayıda insanla
        derin, gerisiyle kibar ve mesafeli. Bu seçim seni koruyor, ve aynı
        zamanda seni odada olmadığın konuşmaların sonucuna razı ediyor.
    mid:
      tr: >-
        İnsanların arasına giriyor, sonra sessizce çıkıyorsun. İkisini de
        yapabiliyor olman bir avantaj, ama hangisine ihtiyacın olduğunu
        genellikle çok geç fark ediyorsun — kalabalıktan çıkarken ya da yalnız
        kaldıktan bir gün sonra.
    high:
      tr: >-
        Yakınlığı hızlı kuruyorsun ve bu insanları rahatlatıyor. Konuşarak
        düşünüyorsun, o yüzden yalnız kaldığında düşünce de duruyor. Bedeli şu:
        bazı şeyler ancak kimseye anlatmadan bitiyor, ve o şeyler sende
        birikiyor.
  OPENNESS:
    low:
      tr: >-
        İşin ortasında yolu değiştirmiyorsun. Başladığın gibi bitiriyorsun ve
        bu, çoğu işi kurtaran şey. Kaçırdığın şey şu: bazen ortada görünen daha
        iyi yol gerçekten daha iyi yoldur, ve sen ona bakmadan geçiyorsun.
    mid:
      tr: >-
        Ortada bir kez duruyor, bakıyor, sonra devam ediyorsun. Bu duruş sana
        pahalıya gelmiyor ama tam olarak neye baktığını da belirlemediğin için
        çoğu zaman aynı kararı tekrar veriyorsun.
    high:
      tr: >-
        İşin ortası senin için en canlı yer — orada yeni bir şey görüyorsun ve
        görmemiş gibi yapamıyorsun. Bu, işi zenginleştiriyor ve bitmesini
        geciktiriyor. İkisi aynı huyun iki yüzü, birini alıp diğerini bırakmak
        mümkün değil.
  AGREEABLENESS:
    low:
      tr: >-
        Anlaşmayı sürdürmek için katılmıyormuş gibi yapmıyorsun. Bu, seninle
        çalışan herkesin nerede durduğunu bilmesini sağlıyor — ve bazılarının
        seninle bir daha çalışmak istememesini de.
    mid:
      tr: >-
        Uzlaşmayı seçiyorsun ama sınırın var. Sınırın nerede olduğunu
        söylemediğin için, ona basıldığında verdiğin tepki karşı tarafa ani
        geliyor; sana gelmiyor, sen yıllardır oradaydın.
    high:
      tr: >-
        Aranın iyi kalması senin için arka plan değil, işin bir parçası. Bu
        emeği kimse görmüyor çünkü iyi yapıldığında görünmez oluyor — ve
        görünmediği için de karşılığı ödenmiyor.
  NEUROTICISM:
    low:
      tr: >-
        Güçlü tarafının bedeli sende geç geliyor. Sarsılmadığın için etrafındaki
        herkes sana yaslanıyor, ve yaslanılan kişinin kendi ağırlığını ne zaman
        bıraktığını kimse sormuyor.
    mid:
      tr: >-
        Zorlandığını belli etmiyorsun ama etmemek bedava değil. Toparlanma
        hızın, sana ne kadar yüklendiğinin ölçüsü haline geliyor — ve o ölçüyü
        sen koymuyorsun.
    high:
      tr: >-
        Bedeli peşin ödüyorsun. Kötü ihtimali önceden yaşamak seni hazırlıklı
        yapıyor ve aynı anda yoruyor; gerçekleşmeyen tehlikelerin faturası da
        gerçekleşenler kadar tutuyor.

# Derin raporun açılışı. Serbest rapordaki açılışın daha uzunu değil — orası
# "kimsin" diyor, burası "bu nereden geliyor ve seni nereye götürüyor" diyor.
portraits:
  quiet_builder:
    tr: >-
      Senin ilerlemen sıçramalarla değil, katmanlarla oluyor. Bir şeyi
      duyurmadan önce sağlam olmasını istemen bir alçakgönüllülük değil, bir
      risk yönetimi: yarım bir şeyi savunmak zorunda kalmaktansa hiç
      konuşmamayı seçiyorsun. Bu seni güvenilir yapıyor ve görünmez tutuyor,
      ve ikisi aynı tercihten çıkıyor. Zamanla şu ortaya çıkıyor: insanlar sana
      güveniyor ama seni hatırlamıyor. Değiştirmen gereken şey çalışma biçimin
      değil, biten işi ne zaman söylediğin.
  spark:
    tr: >-
      Sende fikir üretimi bir yetenek değil, bir refleks — ve refleksler
      durdurulamaz, sadece yönlendirilebilir. Başladığın her şey başladığı anda
      gerçekten iyi bir fikirdi; sorun fikirlerin kalitesinde değil, hiçbirinin
      sıkıcı olan orta kısmına gelmemesinde. Yeni bir şeye başlamak, eskisinin
      zorlaştığı anda geliyor ve bu tesadüf değil. Sende işe yarayan tek şey
      şu: aynı anda kaç şeyin açık olduğunu bir yere yazmak. Seçmek acı verici,
      ama seçmemek de sürekli ve daha sessiz bir acı.
  night_watch:
    tr: >-
      Senin dikkatinin varsayılan hali tarama. Bir odaya girdiğinde neyin yanlış
      gidebileceğini herkesten önce görüyorsun ve bu, defalarca birilerini
      kurtardı — sayılmayan, teşekkür edilmeyen defalar. Bunun mekaniği şu:
      beden tehlikeyi gerçekleşmesini beklemeden yaşıyor, o yüzden yanlış alarm
      da gerçek alarm kadar yoruyor. Senin meselen daha az fark etmek değil;
      fark ettikten sonra bırakabilmek. Nöbet devredilebildiğinde nöbet, tutan
      kişiyi tüketmiyor.
  table_setter:
    tr: >-
      Sen bir grubu ayakta tutan görünmez işi yapıyorsun: kimin küstüğünü, kimin
      çağrılmadığını, kimin bir şey söylemek isteyip söyleyemediğini takip
      etmek. Bunu kimse istemedi, sen üstlendin, ve iyi yapıldığında bu iş
      görünmez olduğu için karşılığı da ödenmiyor. Zamanla ortaya çıkan şey şu:
      herkesin ihtiyacını bilen kişi, kendi ihtiyacını söylemeyi unutan kişi
      oluyor. Sofrayı kurmayı bırakman gerekmiyor — sofrada kendine de bir yer
      ayırman gerekiyor, ve bunu önceden yapman gerekiyor, çünkü sonradan yer
      kalmıyor.
  fine_worker:
    tr: >-
      Senin standardın bir tercih değil, bir algı: farkı gerçekten görüyorsun,
      görmemiş gibi yapamıyorsun. Bu yüzden "yeterince iyi" cümlesi sende bir
      uzlaşma değil, bir yalan gibi duruyor. İşin ironisi şu: standardın işi
      iyileştiriyor ama bitmesini engellediğinde iyileştirdiği bir şey kalmıyor.
      Bitmemiş mükemmel iş, bitmiş iyi işten her ölçüde daha kötü. Senin
      öğreneceğin şey daha az önemsemek değil — neyin bittiğine kimin karar
      verdiğini değiştirmek.
  compass:
    tr: >-
      Belirsizlik çoğu insanı durduruyor, seni harekete geçiriyor. Kimse karar
      vermeyince sen veriyorsun, ve bunu istediğin için değil, boşluğa
      dayanamadığın için yapıyorsun. Kararların genelde doğru çıkıyor, bu yüzden
      alışkanlık pekişiyor. Ödediğin bedel kararın kendisinde değil, sürecinde:
      herkesin katılmasını beklemediğin için hızlanıyorsun ve arkanda insan
      bırakıyorsun. Yalnız yürümek bir kere işe yarar, üç kere alışkanlık olur,
      beşinci sefer kimse peşinden gelmez.
  still_water:
    tr: >-
      Sende sakinlik bir çaba değil, varsayılan. Kriz anında etrafındakiler
      farkında olmadan sana bakıp yavaşlıyor ve bu, taşıdığın en işe yarar şey.
      Ama aynı mekanizmanın ikinci bir sonucu var: bir şeyin gerçekten yanlış
      olduğuna karar verme eşiğin de yüksek. Telaşlanmamak, geç fark etmekle
      aynı yerden besleniyor. Senin ayarlaman gereken şey sakinliğin değil —
      "bunu şimdi söylemem gerekiyor" dediğin anın nerede olduğu.
  deep_diver:
    tr: >-
      Sende yaşantının çözünürlüğü yüksek: aynı olay sana daha çok ayrıntı,
      daha çok anlam ve daha çok ağırlık olarak geliyor. Bu, fark ettiğin
      şeylerin sebebi ve yorgunluğunun da sebebi — ikisini ayırmak mümkün değil.
      İnsanların sana anlatmadıklarını anlatması tesadüf değil, derinliğin
      görünüyor. Mesele sığlaşmak değil; dalıştan sonra çıkmayı bir beceri
      olarak öğrenmek. Derinde kalmak seçim değil, alışkanlık haline geldiğinde
      orada bulduğun şeyleri kimseye taşıyamıyorsun.

# Bölümün kapanışı: eksen metni "genelde böyle" der, fragman "sende böyle" der.
# 1 nasıl karar verdiğin · 2 başkalarıyla · 3 işin ortası · 4 bedeli.
  own_clock:
    tr: >-
      Senin motorun takvim değil, dalga. Bu yüzden kurulan her düzen
      sende iki hafta yaşıyor ve sonra sessizce ölüyor — kusur sende
      değil, düzenin varsayımında: o, her günün aynı olduğunu sanıyor.
      Senin için değil. Ama dalganın da bir sorunu var; hiçbir şey
      biriktirmiyor. On yıllık dalga, bir yıllık düzenden az şey
      bırakıyor geriye. Senin arayacağın şey daha sıkı bir program değil
      — kötü günde de duran, gülünecek kadar küçük bir eşik. Dalga
      geldiğinde zaten fazlasını yapacaksın.
  contrarian:
    tr: >-
      Senin reddin bir huysuzluk değil, bir tutarlılık: katılmadığın
      şeye katılmış gibi yapmak sana yalan söylemek gibi geliyor ve
      yalan söylemiyorsun. Bu, seni güvenilir yapıyor — ve pahalı. Çünkü
      insanlar haklılıkla değil, taşınabilirlikle çalışıyor, ve sen
      taşınması zor birisin. İkinci bir mesele daha var: düzeni de
      reddediyorsun, o yüzden itiraz ettiğin şeyin yerine koyacağın şeyi
      kurmakta zorlanıyorsun. İtiraz bedava, alternatif değil. Senin
      öğreneceğin şey uyum değil — reddettiğin şeyin yerine bir şey
      koyup onu iki hafta sürdürmek.
  feet_on_ground:
    tr: >-
      Sende soyut olan şey tutmuyor; nerede, ne zaman, ne kadar belliyse
      iş oluyor, belli değilse olmuyor. Bu bir zeka meselesi değil, bir
      dikkat tercihi: sen önündeki şeye bakıyorsun ve önündeki şey
      genelde çözülmesi gereken şey. Bunun bedeli ileride ortaya
      çıkıyor. Değişmesi gereken bir şey olduğunda, seni harekete
      geçirecek iki şeyden biri lazım — merak ya da plan — ve ikisi de
      senin doğal aletin değil. O yüzden senin için işe yarayan tek
      yöntem şu: bir seferde tek bir somut ayrıntıyı değiştirmek. Büyük
      karar alma, küçük şeyi değiştir ve sonucunu gör.
  as_is:
    tr: >-
      Sende iki şey aynı anda kapalı: yakınlık kurma isteği ve araları
      yumuşatma refleksi. İkisi de olmayınca ortaya çok net bir insan
      çıkıyor — ne beklendiğini bilirsin, ne beklendiğin. Bu netlik
      senin en değerli özelliğin ve çevreni de en çok daraltan şey.
      Mesele şu ki her ikisi de bir tercihti, ama tercihler kontrol
      edilmediğinde alışkanlığa dönüşüyor ve alışkanlık sana danışmıyor.
      Senin yapman gereken şey sosyalleşmek değil — ara ara, hâlâ tercih
      mi diye bakmak. Çoğu zaman evet çıkacak. Bazen çıkmayacak, ve o
      bazen önemli.
  table_upsetter:
    tr: >-
      Sende itiraz bir seçim değil, bir hız meselesi: yanlış olanı görmenle
      söylemen arasında kimseye yetecek kadar boşluk kalmıyor. Bu, odadaki en
      dürüst kişi olmanı sağlıyor ve aynı hız, söylediğin şeyin arkasında
      durmanı zorlaştırıyor — çünkü tepki geçtiğinde iş duruyor, sen de
      duruyorsun. Zamanla insanlar seni ciddiye almayı bırakmıyor ama
      beklemeye başlıyor: itirazın geçeceğini, kararın sensiz alınabileceğini
      öğreniyorlar. Kaybettiğin şey haklılığın değil, haklılığının bir işe
      yaraması. Değiştirmen gereken şey söylediklerin değil, söyledikten
      sonraki ilk hafta.
  light_footed:
    tr: >-
      Sende sakinlik bir çaba değil, bir varsayılan — ve bu, etrafındaki
      insanların gizlice yaslandığı şey. Bir aksilik olduğunda odadaki
      sıcaklığı düşüren sensin, üstelik bunu yaptığını bile bilmiyorsun. Aynı
      varsayılanın diğer tarafı şu: sende hiçbir şey ağırlaşmadığı için hiçbir
      şey birikmiyor da. Zorlanmadan yaptığın işi kendi gözünde küçültüyorsun,
      ve büyütmediğin için de sürdürmüyorsun. Senin için tekrar bir sıkıntı
      değil, sadece görünmez bir şey — o yüzden işaretlemen gerekiyor. On dört
      gün sonra elinde kalacak olan şey, hissettiğin ilerleme değil, yazdığın
      kayıt.
  full_glass:
    tr: >-
      Sende yoğunluk bir arıza değil, çözünürlük: herkesin arka planda tuttuğu
      şeyleri sen ön planda tutuyorsun ve bu yüzden hiçbiri sırasını
      bekleyemiyor. Fark etme gücün ile başlama gücün aynı yerden besleniyor,
      o yüzden ikisi aynı anda tükeniyor. Erteleme sende tembellik değil, dolu
      bir bardağı taşırmama refleksi — ve gün sonunda geriye yapılmış bir şey
      kalmadığında bunu bir karakter kusuru gibi okuyorsun, ki asıl yorucu olan
      bu okuma. Sende işe yarayan tek ölçek küçük olan: beş dakikada biten bir
      şey, planlanmış bir saatten daha çok taşıyor seni. Değiştirmen gereken
      şey hissetme şiddetin değil, bir günü kaçırdığında kendine söylediğin
      cümle.
  word_is_bond:
    tr: >-
      Senin güvenilirliğin bir tercih değil, bir kimlik — ve kimlik olduğu için
      pazarlığa açık değil. Sözünü tuttuğun için insanlar seni takip etmiyor,
      ve takip edilmediğin için de yükünün ne kadar olduğunu kimse bilmiyor.
      "Yapamam" cümlesini kurmamanın sebebi korku değil, o cümlenin sana kendi
      tanımını bozuyormuş gibi gelmesi. Oysa bir sözün değeri kaç tane
      verdiğinle ters orantılı: hepsini kabul ettiğinde tuttuğun her söz biraz
      daha ucuzluyor, ve önce senin kendi işin ödüyor. Değiştirmen gereken şey
      sözünü tutman değil, sözü vermeden önce geçen üç saniye.
  in_its_place:
    tr: >-
      Sende istikrar bir alışkanlık değil, bir yöntem: denenmiş olanı seçmek
      seni yanıltmıyor ve yanıltmadığı için de sorgulanmıyor. Etrafındakiler
      sana göre plan kurabiliyor, ki bu insanların çoğunda olmayan bir şey. Bu
      yöntemin görünmeyen maliyeti şu: bir şeyin bozulduğunu, uzun süredir
      orada olduğu için geç fark ediyorsun. Değişimi geciktirmek sana hiçbir
      şeye mal olmuyormuş gibi duruyor, çünkü faturası hemen değil birikerek
      geliyor — ve geldiğinde artık küçük bir düzeltmeyle kapanmıyor.
      Değiştirmen gereken şey düzenin değil, düzene ne zaman baktığın.
  inwardly:
    tr: >-
      Sende fark etmek istemsiz: odadaki gerginliği, birinin sesindeki
      değişikliği, söylenmeyen şeyi görüyorsun ve görür görmez bir şey de
      yapıyorsun. Bunun karşılığını istememen bir alçakgönüllülük değil, bir
      alışkanlık — istemek sana zorlama gibi geliyor, oysa istenmediği sürece
      gelmeyen şeye zorlama değil yakınlık deniyor. İçeride tuttuğun şey
      küçülmüyor, birikiyor, ve biriken şeyi de yine tek başına taşıyorsun.
      Yıllar içinde ortaya çıkan tablo şu: herkes senin iyi olduğunu sanıyor,
      çünkü hiç kötü olmadığını söylemedin. Değiştirmen gereken şey ne kadar
      fark ettiğin değil, fark ettiğin şeyin kaçta kaçını söylediğin.
fragments:
  quiet_builder:
    1:
      tr: >-
        Sende karar, bir anda değil bir süre içinde oluyor. Kimseye
        danışmadığın için dışarıdan ani görünüyor, oysa sen haftalardır
        oradasın.
    2:
      tr: >-
        Az kişiye çok şey veriyorsun. Bu çemberin dışındakiler seni soğuk
        sanıyor; içindekiler için ulaşılabilecek en sağlam kişisin.
    3:
      tr: >-
        Ortada yavaşlamıyorsun, ama tıkandığında da söylemiyorsun. Sessizce
        ilerlemenin bedeli, sessizce takılıp kalmak.
    4:
      tr: >-
        Sana pahalıya gelen şey görünmezlik. İşin konuşulduğu odada adın
        geçmediğinde bunu düzeltmiyorsun, ve düzeltmediğin için tekrar oluyor.
    5:
      tr: >-
        Anlaşmazlıkta tartışmıyorsun, çekiliyor ve kendi bildiğini
        yapmaya devam ediyorsun. Bu bir uzlaşma değil, sessiz bir ısrar — ve
        karşındaki anlaştığınızı sanıyor.
  spark:
    1:
      tr: >-
        Karar vermiyorsun, başlıyorsun — ve başlamak sende karar vermenin yerini
        tutuyor. Bu, çoğu zaman işe yarıyor ve arada bir pahalıya patlıyor.
    2:
      tr: >-
        İnsanlar senin yanında bir şeye başlama cesareti buluyor. Aynı
        insanlar, sen o şeyden çıktığında nerede olduğunu da soruyor.
    3:
      tr: >-
        İşin ortası senin en zayıf yerin. Yenilik bittiğinde ilgi de bitiyor,
        ve tam o noktada yeni bir kapı açılıyor.
    4:
      tr: >-
        Sana pahalıya gelen şey yarım kalanların birikmesi. Her biri tek başına
        önemsiz, hepsi birlikte "ben bitiremem" cümlesini kuruyor.
    5:
      tr: >-
        Anlaşmazlık seni uzun süre meşgul etmiyor, çünkü aklın çoktan bir
        sonraki fikirde. Karşındaki hâlâ konuşulanı düşünürken sen konuyu
        kapatmış oluyorsun.
  night_watch:
    1:
      tr: >-
        Karar verirken en kötü ihtimalden geri sayıyorsun. Bu seni hazırlıklı
        yapıyor ve aynı zamanda hiçbir kararın rahat hissettirmemesini
        sağlıyor.
    2:
      tr: >-
        Sevdiklerini uyarıyorsun ve uyarı, ilgiyle aynı şey olarak
        anlaşılmıyor. Sen tehlikeyi anlatırken karşı taraf eleştiri duyuyor.
    3:
      tr: >-
        İşin ortasında kontrol ediyorsun, tekrar kontrol ediyorsun. Bir yerden
        sonra kontrol işi ilerletmiyor, sadece seni oyalıyor.
    4:
      tr: >-
        Sana pahalıya gelen şey dinlenememek. Nöbeti kimseye devretmediğin için
        nöbet hiç bitmiyor, ve bitmeyen nöbet dikkati de köreltiyor.
    5:
      tr: >-
        Anlaşmazlıkta neyin ters gidebileceğini önce sen görüyorsun ve
        haklı çıkma ihtimalin yüksek. Bedeli şu: karşındaki uyarıldığını
        değil, suçlandığını duyuyor.
  table_setter:
    1:
      tr: >-
        Karar verirken önce kimin ne hissedeceğine bakıyorsun. Bu, çoğu kararı
        daha iyi yapıyor ve bazılarını imkânsız hale getiriyor.
    2:
      tr: >-
        Burası senin en güçlü olduğun bölüm. İnsanları bir arada tutmak
        öğrenilmesi en zor beceri ve sen onu düşünmeden yapıyorsun.
    3:
      tr: >-
        İşin ortasında başkasının işine bakıyorsun. Kendi işin geri kalıyor ve
        bunu fark ettiğinde suçlusu olarak yine kendini görüyorsun.
    4:
      tr: >-
        Sana pahalıya gelen şey sıranın hiç sana gelmemesi. Kimse seni sona
        koymuyor — sen koyuyorsun, ve o kadar sessiz koyuyorsun ki kimsenin
        itiraz etmesi için sebep olmuyor.
    5:
      tr: >-
        Anlaşmazlığı bir an önce kapatmak istiyorsun, çünkü açık kalan
        gerginlik sana fiziksel geliyor. Kapatmak çözmek değil; kapattığın şey
        ertesi hafta aynı yerden açılıyor.
  fine_worker:
    1:
      tr: >-
        Karar verirken detaya bakıyorsun ve detay çoğu zaman haklı çıkıyor.
        Haklı çıkmadığında ise küçük bir şey yüzünden büyük bir şeyi
        geciktirmiş oluyorsun.
    2:
      tr: >-
        İnsanlara da aynı standartla bakıyorsun ve bunu söylemesen de
        anlaşılıyor. Yanındakiler kendilerini ölçülüyor hissediyor.
    3:
      tr: >-
        İşin ortası senin en uzun kaldığın yer. Bitmiş sayılabilecek şeyi
        bitmiş saymamak, senin en pahalı alışkanlığın.
    4:
      tr: >-
        Sana pahalıya gelen şey bitirememek. Ortaya çıkmamış mükemmel iş, ortaya
        çıkmış iyi işten hiçbir ölçüde daha değerli değil — ama içeriden öyle
        hissettirmiyor.
    5:
      tr: >-
        Anlaşmazlıkta standardın tarafını tutuyorsun, karşındakinin
        değil. Haklı olduğun yerde bile bu, tartışmayı işten kişiye taşıyor.
  compass:
    1:
      tr: >-
        Karar senin için bir yük değil, bir rahatlama. Boşluğa dayanamadığın
        için seçiyorsun, ve seçtiğin şey genelde doğru olduğu için bu huy hiç
        sorgulanmıyor.
    2:
      tr: >-
        İnsanlar sana yön için geliyor, yakınlık için değil. Bu ayrımı sen de
        biliyorsun ve bazen tam da bu yüzden yorgunsun.
    3:
      tr: >-
        İşin ortasında hızlanıyorsun. Arkanda kalanları kontrol etmek yavaşlatır
        diye düşünüyorsun, ve haklısın — ama arkanda kalanlar da orada kalıyor.
    4:
      tr: >-
        Sana pahalıya gelen şey yalnızlık. Kararın doğruluğu, o kararı tek
        başına vermiş olmanın açtığı mesafeyi kapatmıyor.
    5:
      tr: >-
        Anlaşmazlıkta pozisyonunu netleştirip orada duruyorsun. Herkesin
        katılmasını beklemediğin için karar hızlı çıkıyor, ve arkanda kimse
        kalmıyor.
  still_water:
    1:
      tr: >-
        Karar verirken acele etmiyorsun ve acelesizlik çoğu zaman doğru cevabı
        getiriyor. Getirmediğinde ise karar seni değil, zaman seni geçmiş
        oluyor.
    2:
      tr: >-
        Yanında olmak insanları sakinleştiriyor. Bunu bilerek yapmıyorsun,
        o yüzden karşılığını da istemiyorsun.
    3:
      tr: >-
        İşin ortasında telaşlanmıyorsun, ama hızlanman gereken yeri de geç fark
        ediyorsun. Sakinlik burada bir maliyet.
    4:
      tr: >-
        Sana pahalıya gelen şey söylememek. Sorun etmediğin şey büyüyor ve
        büyüdüğünde artık senin meselen olmaktan çıkmış oluyor.
    5:
      tr: >-
        Anlaşmazlıkta sesini yükseltmiyorsun ve bu odayı sakinleştiriyor.
        Aynı sakinlik, gerçekten çözülmesi gereken şeyin hiç gündeme
        gelmemesine de yol açıyor.
  deep_diver:
    1:
      tr: >-
        Karar verirken çok fazla şey hissediyorsun ve hepsi geçerli. Zor olan
        seçmek değil, hangisinin bilgi hangisinin gürültü olduğunu ayırmak.
    2:
      tr: >-
        İnsanlar sana söylemediklerini söylüyor çünkü anlayacağını biliyorlar.
        Bu bir ayrıcalık ve aynı zamanda taşıdığın ağırlığın bir kısmı.
    3:
      tr: >-
        İşin ortasında derine iniyorsun ve zaman kayboluyor. Çıktığında bulduğun
        şey genelde değerli, ama çıkma anını kimse senin için işaretlemiyor.
    4:
      tr: >-
        Sana pahalıya gelen şey iniş ile çıkış arasındaki fark. İyi olanı da
        kötü olanı da aynı derinlikte taşımak, günü herkesinkinden uzun yapıyor.

# Yakın arketiple karşılaştırma. Aynı bandı paylaştığın biriyle nerede
# ayrıldığını söyler — arketip adının bir kategori değil, bir yorum olduğunu
# en açık gösteren yer burası.
    5:
      tr: >-
        Anlaşmazlığı günlerce taşıyorsun, karşındaki ertesi gün unutmuş
        oluyor. Aradaki fark seni haksız değil, yalnız bırakıyor.
  own_clock:
    1:
      tr: >-
        Karar vermiyorsun, dalga geldiğinde hareket ediyorsun. Bu yüzden
        dışarıdan kararsız görünüyorsun, oysa sen sadece hazır olmayı
        bekliyorsun.
    2:
      tr: >-
        Kimseye söylemediğin için kimse seni beklemiyor. Bu özgürlük, ve
        aynı zamanda hiçbir şeyin seni çağırmaması demek.
    3:
      tr: >-
        İşin ortası senin en tehlikeli yerin. Dalga çekildiğinde iş
        yarım kalıyor ve yarım kalan şey bir daha açılmıyor.
    4:
      tr: >-
        Sana pahalıya gelen şey biriktirememek. Yaptığın işler tek tek
        iyi, ama üst üste konmadıkları için hiçbiri bir şeye dönüşmüyor.
    5:
      tr: >-
        Anlaşmazlıkta karşı çıkmıyorsun, o iş sadece sende olmuyor.
        Karşındaki bunu itiraz olarak değil ihmal olarak okuyor, ve ikisi ayrı
        şeyler.
  contrarian:
    1:
      tr: >-
        Karar verirken herkesin ne dediğine bakıyorsun — tersini yapmak
        için. Bu bazen isabetli, bazen sadece ters.
    2:
      tr: >-
        İnsanlar seninle nerede olduklarını biliyor ve bu nadir. Aynı
        netlik, bazılarının bir daha gelmemesinin de sebebi.
    3:
      tr: >-
        İşin ortasında kurallar can sıkmaya başlıyor. Tam o noktada
        bıraktığın şeylerin sayısı, itiraz ettiğin şeylerin sayısından
        fazla.
    4:
      tr: >-
        Sana pahalıya gelen şey yalnız kalmak. Haklı olmak, kimsenin
        seni aramamasını telafi etmiyor.
    5:
      tr: >-
        Anlaşmazlık senin en rahat olduğun yer; katılmadığını söylemek
        sana hiçbir şeye mal olmuyor. Bedeli sonra çıkıyor: bir şeye ihtiyacın
        olduğunda harcadığın iyi niyet orada olmuyor.
  feet_on_ground:
    1:
      tr: >-
        Karar verirken elindeki bilgiye bakıyorsun, olabilecek bilgiye
        değil. Bu seni hızlı yapıyor ve bazen dar.
    2:
      tr: >-
        İnsanlarla aran iyi çünkü onlarla uğraşmıyorsun, işle
        uğraşıyorsun. Bu bir sadelik ve karşındaki bunu rahatlatıcı
        buluyor.
    3:
      tr: >-
        İşin ortasında yol değiştirmiyorsun. Bu çoğu işi kurtarıyor ve
        bir kısmını da eski hâlinde tutuyor.
    4:
      tr: >-
        Sana pahalıya gelen şey aynı kalmak. Elindekiyle çözmek bir
        beceri, ama elindeki hiç değişmiyorsa çözüm de değişmiyor.
    5:
      tr: >-
        Anlaşmazlıkta teoriye girmiyor, "şu an ne yapacağız" diye
        soruyorsun. Bu tartışmayı kısaltıyor, ve tartışmanın asıl sebebini
        olduğu yerde bırakıyor.
  as_is:
    1:
      tr: >-
        Karar verirken kimseye danışmıyorsun ve bu kararı hızlandırıyor.
        Danışmadığın için gözden kaçan şeyler de sende kalıyor.
    2:
      tr: >-
        Az kişiye tamamen açıksın. O az kişi meşgul olduğunda geriye
        kimse kalmıyor ve bunu planlamıyorsun.
    3:
      tr: >-
        İşin ortasında yardım istemiyorsun. İstemediğin için tıkandığını
        da kimse görmüyor.
    4:
      tr: >-
        Sana pahalıya gelen şey sorulmamak. Kimse seni dışarıda
        bırakmıyor; sen kapıyı kapalı tutuyorsun ve kapalı kapı bir süre
        sonra çalınmıyor.
    5:
      tr: >-
        Anlaşmazlıkta araları düzeltmek için uğraşmıyorsun; olan olmuştur.
        Bu dürüst, ama karşındaki için kapının kapandığı an — ve sen
        kapandığını fark etmiyorsun.
  table_upsetter:
    1:
      tr: >-
        Karar sende bir tartışmanın sonunda değil, ortasında oluşuyor. Bu
        yüzden hızlısın, ve bu yüzden kararın kime ait olduğu sonradan
        tartışılıyor.
    2:
      tr: >-
        İnsanlar seninle konuşurken kendilerini toparlıyor, çünkü ne
        diyeceğini bilmiyorlar. Bu sana yakınlık değil, dikkat kazandırıyor;
        ikisini karıştırdığında yalnız kalıyorsun.
    3:
      tr: >-
        İşin ortası senin en zayıf yerin: itiraz bittiğinde ilgi de bitiyor.
        Devirdiğin masayı toplamak, devirmek kadar senin işin.
    4:
      tr: >-
        Sana pahalıya gelen şey haklılık değil, haklılığının bir işe
        yaramaması. Bir süre sonra insanlar seni dinlemiyor, geçmeni bekliyor.
    5:
      tr: >-
        Sen ve karşındaki aynı anda haklı olamadığında geri adım atmak sana
        kaybetmek gibi geliyor. Oysa bir kez bıraktığında, bir dahaki sefere
        söylediğin şey daha ağır basıyor.
  light_footed:
    1:
      tr: >-
        Karar sende bir yük olmuyor, o yüzden karardan sonra da geri dönüp
        bakmıyorsun. İyi kararlarda bu bir hız, kötülerde bir gecikme.
    2:
      tr: >-
        Odaya girdiğinde ortam yumuşuyor ve bunu yaptığını bilmiyorsun. Aynı
        rahatlık, kimsenin sana ciddi bir şey açmamasına da yol açıyor.
    3:
      tr: >-
        Ortada zorlanmadığın için ortayı fark etmiyorsun. Bir işin bittiğini
        anlamak sende, başladığını anlamaktan daha zor.
    4:
      tr: >-
        Sana pahalıya gelen şey ağırlığın olmaması. Hiçbir şey seni
        yormadığı için hiçbir şey birikmiyor, ve birikmediği için de
        sürdürmenin bir sebebi doğmuyor.
    5:
      tr: >-
        Anlaşmazlıkta genelde sen bırakıyorsun, çünkü bırakmak sana bir şeye
        mal olmuyor. Bunun bedelini karşındaki ödüyor: senin gerçekten neye
        önem verdiğini hiç öğrenemiyor.
  full_glass:
    1:
      tr: >-
        Karar sende bilgi eksikliğinden değil, seçenek fazlalığından
        gecikiyor. Hepsi aynı anda önemli görününce hiçbiri sırasını
        bekleyemiyor.
    2:
      tr: >-
        İnsanlarla aranı bozan şey mesafe değil, dalgalanma. Aynı hafta
        içinde çok yakın ve çok uzak olabiliyorsun, ve karşındaki hangisinin
        gerçek olduğunu bilmiyor.
    3:
      tr: >-
        İşin ortası sende en dolu yer: başlarken hissettiğin şey daha
        bitmeden bir sonrakine geçmiş oluyor. Ortada durabilmek için işin
        küçük olması gerekiyor.
    4:
      tr: >-
        Sana pahalıya gelen şey, taşmamak için harcadığın enerji. İşin
        kendisine kalan pay küçülüyor, ve gün sonundaki boşluk ertesi günü
        ağırlaştırıyor.
    5:
      tr: >-
        Anlaşmazlık sende konudan çok önce hissediliyor, o yüzden ya çok
        erken geri çekiliyor ya da olduğundan büyük tepki veriyorsun. İkisi de
        aynı doluluktan çıkıyor.
  word_is_bond:
    1:
      tr: >-
        Karar sende "yapılabilir mi" değil, "söz verdim mi" üzerinden
        işliyor. Bu seni güvenilir yapıyor ve yanlış bir sözü de sonuna kadar
        taşıtıyor.
    2:
      tr: >-
        İnsanlar sana yaklaşmakta zorlanmıyor, çünkü hiç geri çevirmiyorsun.
        Yakınlığın da yükün de aynı kapıdan giriyor.
    3:
      tr: >-
        İşin ortasında aksamıyorsun; senin aksadığın yer kendi işinin ortası.
        Başkasının işi araya girdiğinde seninki her seferinde bekliyor.
    4:
      tr: >-
        Sana pahalıya gelen şey hayır diyememek değil, hayır demediğini
        kimsenin fark etmemesi. Yükün görünmediği için azalmıyor.
    5:
      tr: >-
        Sen ve karşındaki aynı anda haklı olamadığında, haklı olanı onun
        olması senin için daha kolay. Bunu bir incelik sanıyorsun; bir süre
        sonra bir beklentiye dönüşüyor.
  in_its_place:
    1:
      tr: >-
        Karar sende yeni bilgiyle değil, denenmişlikle veriliyor. Bu seni
        yanıltmıyor, ama denenmemiş olanın ne getireceğini de hiç öğrenmiyorsun.
    2:
      tr: >-
        İnsanlar senin nerede duracağını biliyor ve bu onları rahatlatıyor.
        Aynı öngörülebilirlik, kimsenin sana yeni bir şey sormamasına da yol
        açıyor.
    3:
      tr: >-
        İşin ortası senin en güçlü yerin: heyecan bittiğinde de aynı hızda
        gidiyorsun. Fark etmediğin şey, aynı hızla yanlış yöne de
        gidilebildiği.
    4:
      tr: >-
        Sana pahalıya gelen şey ertelenen değişimin faturası. Hemen
        görünmüyor, birikerek geliyor, ve geldiğinde küçük bir düzeltme
        yetmiyor.
    5:
      tr: >-
        Anlaşmazlıkta pozisyonunu değiştirmiyorsun, çünkü pozisyonun bir
        görüş değil bir zemin. Karşındakinin haklı olduğu durumda bile geri
        adım, sana zemini kaybetmek gibi geliyor.
  inwardly:
    1:
      tr: >-
        Karar sende kendi isteğinle değil, kimin etkileneceğiyle veriliyor.
        Bu seni dikkatli yapıyor, ve kendi isteğinin ne olduğunu unutturuyor.
    2:
      tr: >-
        Az kişiyle çok derin bir yakınlık kuruyorsun ve o yakınlığı sen
        taşıyorsun. Karşı tarafın taşıması gerektiğini söylemek, senin için
        yakınlığı riske atmak demek.
    3:
      tr: >-
        İşin ortasında durup durmadığını kimse bilmiyor, çünkü tıkandığını
        söylemiyorsun. Sessizce ilerlemenin bedeli, sessizce takılıp kalmak.
    4:
      tr: >-
        Sana pahalıya gelen şey söylenmeyenin birikmesi. Herkes iyi olduğunu
        sanıyor, çünkü kötü olduğunu hiç söylemedin.
    5:
      tr: >-
        Anlaşmazlıkta karşındakinin haklı olmasına izin vermek sende bir
        refleks. Bunu barış sanıyorsun; karşındaki için bu, senin ne
        düşündüğünü hiç öğrenememek.
comparisons:
  quiet_builder:
    tr: >-
      İnce İşçi ile aynı yerden geliyorsunuz: ikiniz de yüksek bir eşik
      taşıyorsunuz. Fark şurada — onun eşiği işin kalitesinde, seninki işin
      hazır olmasında. O bitmiş bir şeyi beğenmediği için tutuyor, sen sağlam
      olmadığını düşündüğün için tutuyorsun. Bu yüzden onun çıkmazı mükemmellik,
      seninki görünmezlik.
  spark:
    tr: >-
      Yön Veren ile ikiniz de hızlısınız ve ikiniz de beklemeyi sevmiyorsunuz.
      Fark şurada — o bir yön seçip arkasında duruyor, sen bir sürü yönü aynı
      anda açık tutuyorsun. Onun riski yanlış yöne kararlılıkla gitmek, seninki
      hiçbir yöne yeterince gitmemek.
  night_watch:
    tr: >-
      Derin Dalgıç ile ikiniz de yoğun hissediyorsunuz ve ikiniz de bunun
      bedelini ödüyorsunuz. Fark şurada — o içeri doğru derinleşiyor, sen
      dışarıyı tarıyorsun. Onun yorgunluğu anlamdan geliyor, seninki
      tetikte olmaktan.
  table_setter:
    tr: >-
      Yön Veren ile ikiniz de bir grubun merkezindesiniz. Fark şurada — o
      kararla merkeze geliyor, sen ilgiyle. İnsanlar ona ne yapacaklarını
      sormaya, sana nasıl hissettiklerini söylemeye geliyor. Onun bedeli
      yalnızlık, seninki kendini unutmak.
  fine_worker:
    tr: >-
      Sessiz İnşacı ile ikiniz de sabırlısınız ve ikiniz de gürültü
      çıkarmıyorsunuz. Fark şurada — o biriktiriyor, sen düzeltiyorsun. Onun
      için bir şeyin görünmemesi sorun değil; senin için bir şeyin kusurlu
      görünmesi sorun.
  compass:
    tr: >-
      Sofra Kuran ile ikiniz de insanların bulunduğu yerdesiniz. Fark şurada —
      o herkesin katılmasını bekliyor, sen beklemiyorsun. Onun kararları daha
      yavaş ve daha çok destekli, seninkiler daha hızlı ve daha yalnız.
  still_water:
    tr: >-
      Sessiz İnşacı ile ikiniz de sessizsiniz ama sessizliğiniz aynı yerden
      gelmiyor. O odaklandığı için sessiz, sen sarsılmadığın için. Onun riski
      görülmemek, seninki geç görmek.
  deep_diver:
    tr: >-
      Gece Nöbetçisi ile ikiniz de erken hissediyorsunuz. Fark şurada — o neyin
      ters gidebileceğini görüyor, sen neyin gerçekten olduğunu. Onunki bir
      uyarı sistemi, seninki bir çözünürlük farkı. İkiniz de yoruluyorsunuz ama
      farklı sebeplerle dinleniyorsunuz.

  own_clock:
    tr: >-
      Sessiz İnşacı ile ikiniz de gürültü çıkarmadan çalışıyorsunuz ve
      ikiniz de kimseye hesap vermiyorsunuz. Fark şurada — onda her gün
      aynı miktar, sende bazen hepsi bazen hiç. Onun riski görülmemek,
      seninki geriye bir şey kalmaması.
  contrarian:
    tr: >-
      Kıvılcım ile ikiniz de düzenle çalışmıyorsunuz. Fark şurada — o
      çok fikri olduğu için bir yerde duramıyor, sen kimsenin fikrine
      uymadığın için. Onun dağınıklığı bollluktan, seninki reddetmekten
      geliyor.
  feet_on_ground:
    tr: >-
      Durgun Su ile ikiniz de telaş etmiyorsunuz ve ikiniz de sakin
      görünüyorsunuz. Fark şurada — o sarsılmadığı için sakin, sen somut
      olanla uğraştığın için. Onun geç fark ettiği şey duygusal, senin
      geç fark ettiğin şey değişmesi gereken şey.
  as_is:
    tr: >-
      Yön Veren ile ikiniz de uzlaşmak için uğraşmıyorsunuz. Fark şurada
      — o öne çıkarak, sen çekilerek. İkiniz de araları
      yumuşatmıyorsunuz ama onunki bir liderlik biçimi, seninki bir
      mesafe. Onun bedeli arkasında insan bırakmak, seninki hiç yanına
      almamak.
  table_upsetter:
    tr: >-
      Yön Veren ile aynı cesareti taşıyorsunuz: ikiniz de kimsenin almadığı
      pozisyonu alıyorsunuz. Fark şurada — o soğukkanlı olduğu için
      söylüyor, sen dayanamadığın için. Onun itirazı bir karara dönüşüyor,
      seninki bir ana. Bu yüzden onun çıkmazı yalnız kalmak, seninki
      söylediğinin peşini bırakmak.
  light_footed:
    tr: >-
      Kıvılcım ile aynı hafiflikle giriyorsunuz işlere. Fark şurada — onu
      taşıyan şey merak, seni taşıyan rahatlık. O yeni bir kapı açıldığı için
      bırakıyor, sen bırakmak canını yakmadığı için bırakıyorsun. Bu yüzden
      onun çıkmazı seçmek, seninki devam etmeyi önemsemek.
  full_glass:
    tr: >-
      Gece Nöbetçisi ile aynı tetikte duruyorsunuz: ikiniz de olacak olanı
      önceden hissediyorsunuz. Fark şurada — o hissettiğini bir düzene
      çeviriyor, sen bir yüke. Onun tetikte olması hazırlık üretiyor, seninki
      yorgunluk. Bu yüzden onun çıkmazı dinlenememek, seninki başlayamamak.
  word_is_bond:
    tr: >-
      Sofra Kuran ile aynı yerden besleniyorsunuz: ikiniz de başkasının iyi
      olmasını kendi işinizin önüne koyuyorsunuz. Fark şurada — o insanları bir
      araya getirerek yapıyor, sen sözünü tutarak. Onunki bir davet, seninki
      bir yükümlülük. Bu yüzden onun çıkmazı masada kendine yer kalmaması,
      seninki listede kendi satırının olmaması.
  in_its_place:
    tr: >-
      Ayağı Yerde ile aynı yere bakıyorsunuz: ikiniz de teoriye ihtiyaç
      duymuyorsunuz. Fark şurada — o elindekiyle o an çözüyor, sen elindekini
      yıllardır aynı şekilde çalışır tutuyorsun. Onunki doğaçlama, seninki
      bakım. Bu yüzden onun çıkmazı hiçbir şeyin birikmemesi, seninki biriken
      şeyin hiç değişmemesi.
  inwardly:
    tr: >-
      Durgun Su ile aynı mesafeyi koruyorsunuz: ikiniz de az kişiyle, sessizce
      ve derinden. Fark şurada — o sakin olduğu için sessiz, sen dolu olduğun
      için. Onun sessizliği bir rahatlık, seninki bir tutma. Bu yüzden onun
      çıkmazı gerçekten sorun olanı da geciktirmek, seninki taşıdığını kimseye
      söylememek.
