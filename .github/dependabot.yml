version: 2
updates:
  # Dart/Flutter packages across the workspace.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Maven dependencies for the backend services. The Quarkus platform version is
  # a property in services/pom.xml; Dependabot follows it there.
  - package-ecosystem: maven
    directory: /services
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
