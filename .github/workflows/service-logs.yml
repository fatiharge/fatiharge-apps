name: stage logs

# Reads a stage deployment's state and nothing else: `docker compose ps` and
# `docker compose logs`. No write, no restart, never the .env.
#
# It exists so that looking at a deployment does not need anyone's shell
# password. It borrows the deploy key that already reaches that machine, so no
# new access is created, and every run is recorded in Actions.
#
# Two limits, both because THIS REPOSITORY IS PUBLIC and Actions logs are
# public with it:
#
#   * stage only. Production logs carry real people's requests and this would
#     publish them. There is deliberately no way to select it here.
#   * stack frames are stripped. What is left is the timestamp, level, logger,
#     message and `Caused by:` — enough to see what failed, without the frames
#     where field values and payloads end up.
#
# Even so, a stage log message is a public log message. When stage starts
# carrying beta testers rather than smoke tests, delete this file.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which stage deployment to read
        required: true
        type: choice
        options:
          - stage
          - auth-stage
      lines:
        description: Lines per container
        required: false
        default: "100"
        type: string
      since:
        description: Only entries newer than this, e.g. 30m or 2h
        required: false
        default: "1h"
        type: string

permissions:
  contents: read

jobs:
  logs:
    name: Read ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Refuse anything but stage
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # The choice list already limits this. Asserted again because a
          # choice list is a UI, and a workflow edited later is not.
          case "$TARGET_ENV" in
            stage|auth-stage) ;;
            *) echo "this workflow reads stage only, not '$TARGET_ENV'"; exit 1 ;;
          esac

      - name: Prepare the SSH connection
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned rather than scanned: every CI run is a first connection, so
          # accepting whatever answers would accept anything.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Read
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ vars.DEPLOY_PATH }}
          LINES: ${{ inputs.lines }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "${USER_NAME}@${HOST}" \
            bash -s > raw.log <<EOF
            set -euo pipefail
            cd "${TARGET}"
            echo "--- compose ps ---"
            docker compose ps
            echo "--- logs (last ${LINES} lines, since ${SINCE}) ---"
            docker compose logs --tail "${LINES}" --since "${SINCE}" --no-color
          EOF

          # Filtered into the job's output rather than printed and then
          # trimmed: this step's output is the public part.
          grep -vE '^([^|]*\| *)?(at |\.\.\. [0-9]+ more)' raw.log || echo "(nothing)"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.ssh
