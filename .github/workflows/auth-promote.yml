name: auth promote

# Sends an image that already exists to an environment. There is no build step
# on purpose: rebuilding from the same source produces a different artefact — a
# newer base layer, a newer compiler patch — and that is what makes "it worked
# on stage" stop meaning anything.
#
# It accepts stage as well as production, so retrying a failed stage deploy
# costs seconds rather than another native build of an image that is already
# sitting in the registry.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image to deploy, e.g. ghcr.io/fatiharge/auth@sha256:… (the release run prints it)"
        required: true
        type: string
      environment:
        description: Where to send it
        required: true
        default: auth-production
        type: choice
        options: [auth-stage, auth-production]

permissions:
  contents: read

jobs:
  promote:
    name: ${{ inputs.environment }}
    uses: ./.github/workflows/service-deploy.yml
    with:
      image: ${{ inputs.digest }}
      environment: ${{ inputs.environment }}
      compose-file: services/auth/deploy/compose.yaml
      image-variable: AUTH_IMAGE
      required-variables: AUTH_ENV AUTH_HOST AUTH_DB_PASSWORD AUTH_JWT_PRIVATE_KEY AUTH_JWT_PUBLIC_KEY
    secrets: inherit
