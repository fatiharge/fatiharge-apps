name: CI

# Quality gate: formatting, static analysis and tests across the workspace.
# Runs on PRs into main and on pushes to main.
#
# The work is filtered by path, the gate is not. A workflow skipped by a
# top-level `paths:` filter reports no status at all, and a required check that
# never reports blocks the pull request forever — so this always runs, decides
# for itself what changed, and reports through a final job that is always
# reached.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      paused: ${{ steps.pause.outputs.paused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Everything outside these paths is treated as touching the Dart
      # workspace. Erring towards running is deliberate: a needless run costs
      # three minutes, a wrong skip lets a break onto main. `scripts/` counts as
      # Dart work — the melos scripts call into it.
      - name: Decide whether the Dart workspace is affected
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base commit — running everything"
            echo "dart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "changed files:"
          echo "$changed"

          if echo "$changed" | grep -qvE '^(services/|contracts/|architecture/)|\.md$'; then
            echo "dart=true" >> "$GITHUB_OUTPUT"
          else
            echo "dart=false" >> "$GITHUB_OUTPUT"
          fi


      # Paused until PAUSE_UNTIL, on pull requests only. The same builds run
      # locally before every pull request is opened, and waiting for them twice
      # was costing more than it caught. Merges to main still run everything —
      # that is what stands between a broken commit and the stage deploy, which
      # is automatic.
      #
      # Nothing has to be remembered to undo this: the date passes and the jobs
      # come back.
      - name: Whether the heavy jobs are paused
        id: pause
        run: |
          PAUSE_UNTIL=2026-09-06
          today=$(date -u +%F)

          if [ "${{ github.event_name }}" = "pull_request" ] && [[ "$today" < "$PAUSE_UNTIL" ]]; then
            echo "paused until ${PAUSE_UNTIL}; merges to main still run in full"
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  # Split from the tests rather than run before them: formatting and analysis
  # answer in well under a minute, and waiting for the test suite to hear that a
  # file is badly formatted is a minute nobody gets back.
  static:
    name: Format & analyze
    needs: changes
    if: needs.changes.outputs.dart == 'true' && needs.changes.outputs.paused == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dart-workspace
      - run: dart run melos run format
      - run: dart run melos run analyze

  tests:
    name: Test & coverage
    needs: changes
    if: needs.changes.outputs.dart == 'true' && needs.changes.outputs.paused == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dart-workspace
      - run: dart run melos run coverage:check

  # This job's name is the one `main-protection` requires. It is reached on
  # every run, including the ones where the Dart pipeline was skipped, so the
  # required check always reports.
  gate:
    name: Analyze, format & test
    needs: [changes, static, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail only when something that ran failed
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "static:  ${{ needs.static.result }}"
          echo "tests:   ${{ needs.tests.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            exit 1
          fi

          for result in "${{ needs.static.result }}" "${{ needs.tests.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
