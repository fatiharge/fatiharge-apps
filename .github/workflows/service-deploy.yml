name: service deploy

# One place holds how a deployment happens; callers say what to deploy and
# where. Extracted when production promotion became the second caller, because
# two copies of an SSH deploy drift and only one of them gets fixed.

on:
  workflow_call:
    inputs:
      image:
        description: Image digest to run, e.g. ghcr.io/owner/motto@sha256:...
        required: true
        type: string
      environment:
        description: GitHub environment holding this deployment's variables
        required: true
        type: string
      compose-file:
        description: Path in this repository to the compose file to copy
        required: true
        type: string
      image-variable:
        description: The .env key this deployment's image is written to
        required: true
        type: string
      required-variables:
        description: Space-separated .env keys that must be present and non-empty
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare the SSH connection
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned rather than scanned: every CI run is a first connection, so
          # accepting whatever answers would accept anything.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ vars.DEPLOY_PATH }}
          DIGEST: ${{ inputs.image }}
          COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
          IMAGE_VAR: ${{ inputs.image-variable }}
          REQUIRED_VARS: ${{ inputs.required-variables }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy -P "$PORT" -o BatchMode=yes \
            "$COMPOSE_FILE_PATH" "${USER_NAME}@${HOST}:${TARGET}/compose.yaml"

          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "${USER_NAME}@${HOST}" bash -s <<EOF
            set -euo pipefail
            cd "${TARGET}"

            # Compose substitutes an empty string for anything the .env forgot,
            # which turns a missing host into a router rule of Host(\`\`) and a
            # deploy that looks fine until nothing answers. Say so here instead.
            missing=""
            for key in ${REQUIRED_VARS}; do
              grep -qE "^\${key}=.+" .env || missing="\${missing} \${key}"
            done
            if [ -n "\${missing}" ]; then
              echo "missing or empty in ${TARGET}/.env:\${missing}"
              exit 1
            fi

            if grep -q "^${IMAGE_VAR}=" .env; then
              sed -i "s|^${IMAGE_VAR}=.*|${IMAGE_VAR}=${DIGEST}|" .env
            else
              echo "${IMAGE_VAR}=${DIGEST}" >> .env
            fi

            docker compose pull

            # When a container never becomes healthy, compose says only which
            # dependency failed. The logs of the thing that failed are what
            # anyone actually needs, and by the next run they may be gone.
            if ! docker compose up -d --remove-orphans; then
              echo "--- compose ps ---"
              docker compose ps
              echo "--- logs ---"
              docker compose logs --tail 100
              exit 1
            fi

            # Yesterday's image is still on disk and nothing references it.
            docker image prune -f

            docker compose ps
          EOF

      # `up -d` returns as soon as the container starts, which is not the same
      # as the service working. This is the step that decides a deploy failed.
      - name: Wait for the deployed service to report healthy
        env:
          SERVICE_HOST: ${{ vars.SERVICE_HOST }}
        run: |
          if [ -z "${SERVICE_HOST}" ]; then
            echo "SERVICE_HOST is not set for this environment"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS "https://${SERVICE_HOST}/q/health" | grep -q '"status": *"UP"'; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done

          echo "never reported healthy — the previous version is still running"
          # What actually came back, so the first failure explains itself rather
          # than needing a second run to find out.
          echo "--- last response from https://${SERVICE_HOST}/q/health ---"
          curl -sS -i --max-time 10 "https://${SERVICE_HOST}/q/health" || true
          exit 1

      # The key is short-lived anyway, but leaving it on a runner that other
      # steps could read is a habit worth not having.
      - name: Remove the key
        if: always()
        run: rm -rf ~/.ssh
