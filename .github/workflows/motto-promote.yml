name: motto promote

# Sends an image that already exists to an environment. There is no build step
# on purpose: rebuilding from the same source produces a different artefact — a
# newer base layer, a newer compiler patch — and that is what makes "it worked
# on stage" stop meaning anything.
#
# It accepts stage as well as production, so retrying a failed stage deploy
# costs seconds rather than another native build of an image that is already
# sitting in the registry.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image to deploy, e.g. ghcr.io/fatiharge/motto@sha256:… (the release run prints it)"
        required: true
        type: string
      environment:
        description: Where to send it
        required: true
        default: production
        type: choice
        options: [stage, production]

permissions:
  contents: read

jobs:
  promote:
    name: ${{ inputs.environment }}
    uses: ./.github/workflows/service-deploy.yml
    with:
      image: ${{ inputs.digest }}
      environment: ${{ inputs.environment }}
      compose-file: services/motto/deploy/compose.yaml
      image-variable: MOTTO_IMAGE
      required-variables: MOTTO_ENV MOTTO_PROFILE MOTTO_HOST MOTTO_DB_PASSWORD
    secrets: inherit
