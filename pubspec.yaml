name: fatiharge_apps
description: Fatiharge Flutter monorepo (workspace root — not a publishable package).
publish_to: none

environment:
  sdk: ^3.12.0

# Dart native pub workspace. Every app/package below shares one resolution.
# Add new members here (and set `resolution: workspace` in their pubspec).
workspace:
  - packages/lint_kit
  - packages/utility_kit
  - packages/bootstrap_kit
  - packages/card_kit
  # Generated from contracts/ by scripts/generate_api_clients.sh, never by hand.
  - packages/api_client_auth
  - packages/api_client_motto
  - apps/wallet
  - apps/motto

dev_dependencies:
  melos: ^8.6.0
  lint_kit:
    path: packages/lint_kit

melos:
  repository: https://github.com/fatiharge/fatiharge-apps

  command:
    bootstrap:
      # After every `melos bootstrap`, point Git at the versioned hooks dir.
      # This makes the Conventional Commit hook active without a manual step.
      hooks:
        post: git config core.hooksPath .githooks

    version:
      # Derive version bumps + CHANGELOGs from Conventional Commits.
      linkToCommits: true
      workspaceChangelog: true
      branch: main

  scripts:
    analyze:
      description: Run static analysis in every package.
      exec: flutter analyze .

    format:
      description: Verify formatting in every package (fails on diff).
      exec: dart format --set-exit-if-changed .

    format:fix:
      description: Apply formatting in every package.
      exec: dart format .

    test:
      # Goldens are excluded: they are rendered by the host, so a baseline
      # written on macOS does not match one rendered on CI's Linux.
      description: Run tests in every package that has a test/ directory.
      exec: flutter test --exclude-tags golden
      packageFilters:
        dirExists: test

    test:golden:
      description: Run the golden tests. Add -- --update-goldens to rewrite them.
      exec: flutter test --tags golden
      packageFilters:
        dirExists: test

    coverage:
      description: Run tests with coverage in every package that has tests.
      exec: flutter test --coverage --exclude-tags golden
      packageFilters:
        dirExists: test

    coverage:check:
      # One pass, not two: this runs the same tests `test` does, so CI calls
      # this instead of both.
      description: Run tests with coverage and fail below the floor per package.
      run: melos exec --dir-exists="test" -- "flutter test --coverage --exclude-tags golden" && python3 scripts/coverage_gate.py

    generate:
      description: Run build_runner in every package that depends on it.
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    coverage:helper:
      # `flutter test --coverage` only instruments libraries the tests import,
      # so a file with no test is missing from lcov.info rather than reported
      # as 0% — which inflates the number. The generated helper imports every
      # library. It self-checks: the test fails when a new file is not in it.
      description: Regenerate the coverage helper that forces every library into the report.
      exec: ./tool/coverage_helper.sh
      packageFilters:
        fileExists: tool/coverage_helper.sh

    generate:l10n:
      # easy_localization ships a standalone executable, NOT a build_runner
      # builder, so `generate` above does not cover it. Run this after editing
      # anything under assets/translations.
      #
      # The formatting step is not optional: the generator emits code that
      # `dart format --set-exit-if-changed` rejects, which would fail CI.
      description: Regenerate localization keys from assets/translations.
      exec: dart run easy_localization:generate -S assets/translations -s tr.json -O lib/generated -f keys -o locale_keys.g.dart -u && dart format lib/generated
      packageFilters:
        dirExists: assets/translations
