# Which profile lands on which archetype.
#
# Deliberately not in content/: this is scoring data, and editing a sentence
# must never be able to change who gets which result.
#
# Each archetype is a point in the same five-dimensional space a profile lands
# in, plus the dimensions that actually define it. A profile is matched to the
# nearest point, with the defining dimensions weighing four times the rest — so
# being unusually open does not pull someone away from an archetype that has
# nothing to say about openness.
#
# Nearest-point rather than a cascade of thresholds because every profile has to
# land somewhere: a threshold chain leaves gaps, and a gap is a user with no
# result.

version: 1

# How much a dimension the archetype does not name still counts.
background_weight: 0.25

archetypes:
  - id: quiet_builder
    defining: [conscientiousness, extraversion]
    target: {openness: 0.50, conscientiousness: 0.85, extraversion: 0.15, agreeableness: 0.50, neuroticism: 0.50}

  - id: spark
    defining: [openness, extraversion, conscientiousness]
    target: {openness: 0.85, conscientiousness: 0.20, extraversion: 0.80, agreeableness: 0.60, neuroticism: 0.50}

  - id: night_watch
    defining: [conscientiousness, neuroticism]
    target: {openness: 0.50, conscientiousness: 0.80, extraversion: 0.40, agreeableness: 0.50, neuroticism: 0.80}

  - id: table_setter
    defining: [agreeableness, extraversion]
    target: {openness: 0.50, conscientiousness: 0.50, extraversion: 0.80, agreeableness: 0.85, neuroticism: 0.45}

  - id: fine_worker
    defining: [openness, conscientiousness]
    target: {openness: 0.80, conscientiousness: 0.85, extraversion: 0.40, agreeableness: 0.50, neuroticism: 0.50}

  - id: compass
    defining: [extraversion, conscientiousness, agreeableness]
    target: {openness: 0.50, conscientiousness: 0.80, extraversion: 0.80, agreeableness: 0.20, neuroticism: 0.35}

  - id: still_water
    defining: [neuroticism, agreeableness, extraversion]
    target: {openness: 0.45, conscientiousness: 0.50, extraversion: 0.25, agreeableness: 0.75, neuroticism: 0.15}

  - id: deep_diver
    defining: [openness, neuroticism, extraversion]
    target: {openness: 0.85, conscientiousness: 0.45, extraversion: 0.20, agreeableness: 0.55, neuroticism: 0.75}

  # The four the eight left out. Every one of them sits where the first table
  # had no point at all: low conscientiousness that is not Kıvılcım's, low
  # openness that nobody claimed, and low agreeableness away from Yön Veren.
  # Placed by simulation over twenty thousand plausible profiles rather than by
  # eye — the numbers are in the decision record, and the thing being protected
  # is that no archetype becomes so rare it reads as broken.
  - id: own_clock
    defining: [conscientiousness, extraversion]
    target: {openness: 0.45, conscientiousness: 0.10, extraversion: 0.20, agreeableness: 0.60, neuroticism: 0.50}

  - id: contrarian
    defining: [conscientiousness, agreeableness]
    target: {openness: 0.60, conscientiousness: 0.15, extraversion: 0.60, agreeableness: 0.10, neuroticism: 0.50}

  - id: feet_on_ground
    defining: [openness, conscientiousness]
    target: {openness: 0.10, conscientiousness: 0.30, extraversion: 0.50, agreeableness: 0.65, neuroticism: 0.45}

  - id: as_is
    defining: [extraversion, agreeableness]
    target: {openness: 0.45, conscientiousness: 0.60, extraversion: 0.15, agreeableness: 0.15, neuroticism: 0.50}

  # The six the twelve left out.
  #
  # Placed the same way the previous four were — by simulation rather than by
  # eye — but from the other end: instead of looking for empty regions, thirty
  # thousand profiles were scored against the twelve and the worst-fitting
  # fifteen percent were clustered. Each point below is one of those clusters,
  # which is to say each one is a group of people the table was already
  # answering badly rather than a gap on a diagram.
  #
  # What the numbers protect, in the order they were checked:
  #   · every archetype still wins on its own point — a row nobody can reach is
  #     worse than no row at all;
  #   · the rarest stays above three percent, so nothing reads as broken;
  #   · the spread between rarest and commonest stays where twelve had it
  #     (3.2x against 3.0x), so adding six did not buy variety with balance.
  #
  # Two of them are deliberately close to an existing point and separated by a
  # third dimension, because that dimension is the difference a reader would
  # actually name: Masayı Deviren is Yön Veren without the calm, and İçten İçe
  # is Durgun Su without it.

  - id: table_upsetter
    defining: [extraversion, agreeableness, neuroticism]
    target: {openness: 0.55, conscientiousness: 0.45, extraversion: 0.78, agreeableness: 0.15, neuroticism: 0.68}

  - id: light_footed
    defining: [extraversion, neuroticism]
    target: {openness: 0.50, conscientiousness: 0.48, extraversion: 0.82, agreeableness: 0.55, neuroticism: 0.08}

  - id: full_glass
    defining: [conscientiousness, neuroticism]
    target: {openness: 0.55, conscientiousness: 0.18, extraversion: 0.50, agreeableness: 0.50, neuroticism: 0.90}

  - id: word_is_bond
    defining: [agreeableness, conscientiousness]
    target: {openness: 0.45, conscientiousness: 0.82, extraversion: 0.50, agreeableness: 0.85, neuroticism: 0.50}

  - id: in_its_place
    defining: [openness, conscientiousness, neuroticism]
    target: {openness: 0.15, conscientiousness: 0.78, extraversion: 0.50, agreeableness: 0.55, neuroticism: 0.25}

  - id: inwardly
    defining: [agreeableness, extraversion, neuroticism]
    target: {openness: 0.50, conscientiousness: 0.50, extraversion: 0.20, agreeableness: 0.80, neuroticism: 0.72}
