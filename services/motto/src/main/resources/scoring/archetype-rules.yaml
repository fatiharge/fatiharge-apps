# Which profile lands on which archetype.
#
# Deliberately not in content/: this is scoring data, and editing a sentence
# must never be able to change who gets which result.
#
# Each archetype is a point in the same five-dimensional space a profile lands
# in, plus the dimensions that actually define it. A profile is matched to the
# nearest point, with the defining dimensions weighing four times the rest — so
# being unusually open does not pull someone away from an archetype that has
# nothing to say about openness.
#
# Nearest-point rather than a cascade of thresholds because every profile has to
# land somewhere: a threshold chain leaves gaps, and a gap is a user with no
# result.

version: 1

# How much a dimension the archetype does not name still counts.
background_weight: 0.25

archetypes:
  - id: quiet_builder
    defining: [conscientiousness, extraversion]
    target: {openness: 0.50, conscientiousness: 0.85, extraversion: 0.15, agreeableness: 0.50, neuroticism: 0.50}

  - id: spark
    defining: [openness, extraversion, conscientiousness]
    target: {openness: 0.85, conscientiousness: 0.20, extraversion: 0.80, agreeableness: 0.60, neuroticism: 0.50}

  - id: night_watch
    defining: [conscientiousness, neuroticism]
    target: {openness: 0.50, conscientiousness: 0.80, extraversion: 0.40, agreeableness: 0.50, neuroticism: 0.80}

  - id: table_setter
    defining: [agreeableness, extraversion]
    target: {openness: 0.50, conscientiousness: 0.50, extraversion: 0.80, agreeableness: 0.85, neuroticism: 0.45}

  - id: fine_worker
    defining: [openness, conscientiousness]
    target: {openness: 0.80, conscientiousness: 0.85, extraversion: 0.40, agreeableness: 0.50, neuroticism: 0.50}

  - id: compass
    defining: [extraversion, conscientiousness, agreeableness]
    target: {openness: 0.50, conscientiousness: 0.80, extraversion: 0.80, agreeableness: 0.20, neuroticism: 0.35}

  - id: still_water
    defining: [neuroticism, agreeableness, extraversion]
    target: {openness: 0.45, conscientiousness: 0.50, extraversion: 0.25, agreeableness: 0.75, neuroticism: 0.15}

  - id: deep_diver
    defining: [openness, neuroticism, extraversion]
    target: {openness: 0.85, conscientiousness: 0.45, extraversion: 0.20, agreeableness: 0.55, neuroticism: 0.75}
