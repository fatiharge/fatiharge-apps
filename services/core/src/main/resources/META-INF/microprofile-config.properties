# Defaults every service inherits by depending on core.
#
# Precedence runs bottom-up: this file sits below a service's own
# application.properties, which sits below environment variables. So a service
# overrides what it must and a deployment overrides what it must, and neither
# has to edit this file.
#
# No secret appears here, or anywhere else in the repository. Secrets arrive as
# environment variables and only as environment variables.

quarkus.banner.enabled=false

quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Locally the interesting logs are ours, and they are the ones worth seeing in
# full while a feature is being written.
%dev.quarkus.log.category."com.dafalabs".level=DEBUG
%dev.quarkus.log.console.level=DEBUG
