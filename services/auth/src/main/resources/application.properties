# Service-specific configuration. Shared defaults arrive from core; anything a
# deployment must change arrives from the environment. No secret belongs here.

quarkus.application.name=auth

# Distinct from the app services so both can run locally at the same time.
quarkus.http.port=8081

# The core schema belongs to this service. Other services read nothing from it:
# they verify a token locally instead of asking who a device is.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=core
quarkus.flyway.default-schema=core
quarkus.flyway.create-schemas=true
quarkus.hibernate-orm.database.default-schema=core

# Auto-DDL cannot drop a column, cannot rename, cannot be reviewed and cannot be
# rolled back. Flyway owns the schema; Hibernate never touches it.
quarkus.hibernate-orm.database.generation=none

# In dev and test the datasource is a container Quarkus starts itself. Every
# deployment supplies QUARKUS_DATASOURCE_JDBC_URL, _USERNAME and _PASSWORD.
