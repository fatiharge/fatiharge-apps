# Service-specific configuration. Shared defaults arrive from core; anything a
# deployment must change arrives from the environment. No secret belongs here.

quarkus.application.name=auth

# Distinct from the app services so both can run locally at the same time.
quarkus.http.port=8081

# The core schema belongs to this service. Other services read nothing from it:
# they verify a token locally instead of asking who a device is.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=core
quarkus.flyway.default-schema=core
quarkus.flyway.create-schemas=true
quarkus.hibernate-orm.database.default-schema=core

# Auto-DDL cannot drop a column, cannot rename, cannot be reviewed and cannot be
# rolled back. Flyway owns the schema; Hibernate never touches it.
quarkus.hibernate-orm.database.generation=none

# In dev and test the datasource is a container Quarkus starts itself. Every
# deployment supplies QUARKUS_DATASOURCE_JDBC_URL, _USERNAME and _PASSWORD.

# A device token is short-lived and there is nothing to refresh: with no
# account there is no session to keep alive. When it expires the app registers
# again, silently, with the same device hash.
auth.token.lifetime=PT1H

# Only dev and test read a key from disk, and only the worthless one in
# dev-keys/ (see its README). The packaged application has no key configured at
# all: a deployment supplies SMALLRYE_JWT_SIGN_KEY and starts with a signing
# failure if it forgets, which is the failure to have.
%dev.smallrye.jwt.sign.key.location=file:./dev-keys/private.pem
%test.smallrye.jwt.sign.key.location=file:./dev-keys/private.pem
%dev.mp.jwt.verify.publickey.location=file:./dev-keys/public.pem
%test.mp.jwt.verify.publickey.location=file:./dev-keys/public.pem

# The schema is emitted at build time and committed, and the Dart client is
# generated from the committed file — so a change to a resource and the client
# that consumes it land in the same commit.
quarkus.smallrye-openapi.store-schema-directory=../../contracts
quarkus.smallrye-openapi.store-schema-file-name=auth.v1

# The Maven version would otherwise land in the contract, so every version bump
# would show up as a schema change. The contract is versioned by its path.
quarkus.smallrye-openapi.info-version=1.0.0

# Without this the schema carries whatever host the build machine had —
# http://localhost:8080 — and the generated client defaults to it. The base URL
# belongs to the deployment, so the client is given one at runtime.
quarkus.smallrye-openapi.auto-add-server=false
