# Deployed by the release workflow, which copies this file to the server and
# rewrites AUTH_IMAGE to the digest it just built. Everything environment
# specific comes from the .env beside it, which lives only on the server.
#
# The proxy settings match what already runs on that box: the reverse-proxy
# network, the websecure entrypoint and the myresolver certificate resolver.
# They stay overridable because the day they change, editing one .env beats
# editing every service.

name: auth-${AUTH_ENV}

services:
  api:
    image: ${AUTH_IMAGE}
    container_name: auth-${AUTH_ENV}-api
    restart: unless-stopped
    # No QUARKUS_PROFILE, for the reason in services/README.md: a native image
    # bakes its build-time configuration under the profile it was built with, so
    # stage and production run the same artefact and differ only by what is
    # below.
    #
    # This service holds the private key. It is the only place that has one, and
    # it never leaves the .env on the server — the pair in dev-keys/ is worthless
    # and exists so a fresh clone can run its tests.
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/auth
      QUARKUS_DATASOURCE_USERNAME: auth
      QUARKUS_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      SMALLRYE_JWT_SIGN_KEY: ${AUTH_JWT_PRIVATE_KEY}
      MP_JWT_VERIFY_PUBLICKEY: ${AUTH_JWT_PUBLIC_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      # Named explicitly: this container sits on two networks and Traefik would
      # otherwise have to guess which address to route to.
      - traefik.docker.network=${PROXY_NETWORK:-reverse-proxy}
      - traefik.http.routers.auth-${AUTH_ENV}.rule=Host(`${AUTH_HOST}`)
      - traefik.http.routers.auth-${AUTH_ENV}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.auth-${AUTH_ENV}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}
      - traefik.http.services.auth-${AUTH_ENV}.loadbalancer.server.port=8081
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18-alpine
    container_name: auth-${AUTH_ENV}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      # A path rather than a named volume, so a backup is a path someone can
      # point pg_dump at without asking Docker where it put things.
      #
      # Mounted at /var/lib/postgresql, not at .../data. Postgres 18 images
      # store the cluster in a version-named subdirectory so that pg_upgrade
      # can work across a single mount, and they refuse to start when the mount
      # is one level deeper. The 16-era path is the one every older example
      # shows, which is exactly why this comment is here.
      - /var/lib/auth-${AUTH_ENV}-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 12
      # The first start creates the cluster, and every probe that fails while it
      # does would otherwise count against retries — turning a slow first boot
      # into a failed deploy.
      start_period: 60s
    # No proxy network, no published port: the database is reachable only from
    # the service that owns it.
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-reverse-proxy}
  internal:
